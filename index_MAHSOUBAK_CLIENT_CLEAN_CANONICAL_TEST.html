const SUPABASE_URL="https://fkksydpbfqkctvlkoaom.supabase.co";

 ['dashboard','📊','الرئيسية'],['products','📦','المنتجات والمخزون'],['customers','👥','العملاء'],['suppliers','🏭','الموردين'],['reps','🧑‍💼','المندوبين'],['operations','⚙️','Operation / طلبات المخزن'],['purchases','🛒','المشتريات'],['sales','🧾','الفواتير / Orders'],['collections','💰','التحصيلات'],['reports','📈','التقارير'],['accounts','💳','المالية'],['trial','⚖️','ميزان المراجعة'],['regions','♦','المناطق'],['settings','⚙️','الإعدادات / صحة النظام']
];
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function n(v){let x=Number(v);return Number.isFinite(x)?x:0}
function money(v){return 'EGP '+n(v).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2})}
function qty(v){return n(v).toLocaleString('en-US',{maximumFractionDigits:4})}
function headers(){return {apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY}}
async function q(table,select='*',extra=''){let u=SUPABASE_URL.replace(/\/$/,'')+'/rest/v1/'+table+'?select='+encodeURIComponent(select)+(extra?('&'+extra):'');let r=await fetch(u,{headers:headers()});if(!r.ok)throw new Error(table+': '+await r.text());return await r.json()}
async function rpc(fn,body={}){let r=await fetch(SUPABASE_URL.replace(/\/$/,'')+'/rest/v1/rpc/'+fn,{method:'POST',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw new Error(await r.text());return await r.json()}
function setStatus(text,bad=false){let e=document.getElementById('status');if(e)e.innerHTML='<span class="clean-status '+(bad?'clean-error':'')+'"><i class="clean-dot"></i>'+esc(text)+'</span>'}

function table(cols,rows){if(!rows.length)return '<div class="empty">لا توجد بيانات</div>';return '<div class="clean-table-wrap"><table><thead><tr>'+cols.map(c=>'<th>'+c[0]+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+cols.map(c=>'<td>'+esc(typeof c[1]==='function'?c[1](r):r[c[1]])+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}

function kpis(items){return '<div class="clean-kpis">'+items.map(x=>`<div class="clean-kpi"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')+'</div>'}
async function get(name,fetcher){if(cache[name])return cache[name];return cache[name]=await fetcher()}
async function dashboardData(force=false){if(force)delete cache.dashboard;return get('dashboard',async()=>{let a=await q('mahsoubak_app_dashboard_summary');if(!a[0])throw new Error('Dashboard summary empty');return a[0]})}
function dashTile(key,icon,title,value,lines){return `<div class="module-tile tile-${key} clean-card-click" onclick="show('${key}')"><div class="tile-icon">${icon}</div><div class="tile-body"><div class="tile-title">${title}</div><div class="tile-value">${value}</div><div class="tile-lines">${lines.map(x=>'<span>'+x+'</span>').join('')}</div><div class="tile-open">فتح التفاصيل</div></div></div>`}
async function renderDashboard(){let d=await dashboardData();let e=document.getElementById('view-dashboard');e.innerHTML=`<div class="executive-strip"><div class="exec-stat"><span>المبيعات</span><strong>${money(d.company_sales)}</strong><em>${d.invoice_count} فاتورة</em></div><div class="exec-stat"><span>مديونيات العملاء</span><strong>${money(d.receivables_from_sales)}</strong><em>Paid ${money(d.invoice_paid)}</em></div><div class="exec-stat"><span>المخزون</span><strong>${money(d.inventory_value)}</strong><em>${qty(d.stock_qty)} وحدة</em></div><div class="exec-stat"><span>الخزينة</span><strong>${money(d.treasury_balance)}</strong><em>مصروفات ${money(d.expense_total)}</em></div></div><div class="compact-dashboard-grid">${dashTile('sales','💰','المبيعات',money(d.company_sales),[d.invoice_count+' فاتورة','مدفوع '+money(d.invoice_paid)])}${dashTile('products','📦','المخزون',money(d.inventory_value),[qty(d.stock_qty)+' وحدة',d.product_rows+' أصناف'])}${dashTile('operations','⚙️','العمليات','فتح',[ 'طلبات واعتمادات المخزن'])}${dashTile('purchases','🛒','المشتريات','فتح',['فواتير الموردين'])}${dashTile('reps','🧑‍💼','المندوبين',money(d.all_reps_sales),[qty(d.all_reps_qty)+' وحدة'])}${dashTile('customers','👥','العملاء',money(d.receivables_from_sales),['التحصيلات '+money(d.collection_cash)])}</div>${card('خريطة السيولة والالتزامات',kpis([['إجمالي الأصول',money(d.total_assets)],['COGS',money(d.cogs)],['صافي دخل الفترة',money(d.current_period_net_income)],['Balance Sheet Difference',money(d.balance_sheet_difference)]]))}`;}
async function renderProducts(){let rows=await get('inventory',()=>q('mahsoubak_app_inventory_detail'));let total=rows.reduce((a,r)=>a+n(r.ending_inventory_value),0);document.getElementById('view-products').innerHTML=card('المنتجات والمخزون',kpis([['عدد الأصناف',rows.length],['إجمالي الكمية',qty(rows.reduce((a,r)=>a+n(r.current_stock_qty),0))],['قيمة المخزون',money(total)],['COGS',money(rows.reduce((a,r)=>a+n(r.historical_cogs),0))]])+table([['المنتج','product_name'],['الكمية الحالية',r=>qty(r.current_stock_qty)],['تكلفة الوحدة',r=>money(r.canonical_unit_cost)],['قيمة المخزون',r=>money(r.ending_inventory_value)],['الحالة','status']],rows))}
async function renderCustomers(){let [m,b]=await Promise.all([get('customers',()=>q('mahsoubak_customers','id,name,clinic_name,city,area,phone,email,address,active,payload','order=name.asc')),get('custbal',()=>q('mahsoubak_app_customer_receivable_detail'))]);let byId=new Map(b.map(x=>[x.customer_id,x]));let byName=new Map(b.map(x=>[String(x.customer_name||'').trim().toLowerCase(),x]));let rows=m.map(x=>Object.assign({},x,{bal:byId.get(x.id)||byName.get(String(x.name||'').trim().toLowerCase())}));document.getElementById('view-customers').innerHTML=card('العملاء',kpis([['عدد العملاء',m.length],['المديونية',money(b.reduce((a,r)=>a+n(r.receivable_balance),0))],['إجمالي المبيعات',money(b.reduce((a,r)=>a+n(r.sales_total),0))],['المدفوع',money(b.reduce((a,r)=>a+n(r.paid_from_sales),0))]])+table([['العميل','name'],['العيادة','clinic_name'],['المدينة','city'],['المنطقة','area'],['الهاتف','phone'],['الفواتير',r=>r.bal?.invoice_count??0],['المديونية',r=>money(r.bal?.receivable_balance??0)]],rows))}
async function renderSuppliers(){let rows=await get('suppliers',()=>q('mahsoubak_reporting_supplier_balances'));document.getElementById('view-suppliers').innerHTML=card('الموردين',kpis([['عدد الموردين',rows.length],['المشتريات',money(rows.reduce((a,r)=>a+n(r.purchase_total),0))],['المدفوع',money(rows.reduce((a,r)=>a+n(r.paid),0))],['المستحق',money(rows.reduce((a,r)=>a+n(r.payable_balance),0))]])+table([['المورد','supplier_name'],['الفواتير','invoice_count'],['المشتريات',r=>money(r.purchase_total)],['المدفوع',r=>money(r.paid)],['المتبقي',r=>money(r.payable_balance)]],rows))}
async function targetData(){return get('targetdata',async()=>{let [reps,alloc,sales]=await Promise.all([q('mahsoubak_reps','id,name,active,target_qty,payload','active=eq.true&order=name.asc'),q('mahsoubak_sales_allocations','sale_id,rep_id,rep_name,allocated_qty,allocated_total'),q('mahsoubak_sales','id,payload')]);let saleType=new Map(sales.map(s=>[s.id,String((s.payload||{}).order_type||'sale').toLowerCase()]));let m=new Map();for(let a of alloc){if(saleType.get(a.sale_id)!=='sale')continue;let k=a.rep_id||a.rep_name;let z=m.get(k)||{qty:0,sales:0};z.qty+=n(a.allocated_qty);z.sales+=n(a.allocated_total);m.set(k,z)}return reps.map(r=>{let z=m.get(r.id)||m.get(r.name)||{qty:0,sales:0};return {...r,achieved:z.qty,sales:z.sales,pct:n(r.target_qty)>0?z.qty/n(r.target_qty)*100:0}})})}
async function renderReps(){let rows=await targetData();document.getElementById('view-reps').innerHTML=card('المندوبين و Sales Target',kpis([['المندوبين',rows.length],['إجمالي التارجت',qty(rows.reduce((a,r)=>a+n(r.target_qty),0))+' وحدة'],['المحقق بيع فقط',qty(rows.reduce((a,r)=>a+n(r.achieved),0))+' وحدة'],['المبيعات',money(rows.reduce((a,r)=>a+n(r.sales),0))]])+table([['المندوب','name'],['التارجت',r=>qty(r.target_qty)],['المحقق - بيع فقط',r=>qty(r.achieved)],['التحقيق %',r=>r.pct.toFixed(1)+'%'],['المبيعات',r=>money(r.sales)]],rows))}
async function renderOperations(){let rows=await get('orders',()=>q('mahsoubak_sales_orders','id,order_date,customer_id,customer_name,rep_id,rep_name,status,approval_status,total,payload,created_at','order=order_date.desc'));let mapped=rows.map(r=>({...r,product_name:r.payload?.product_name||'',qty:r.payload?.qty||0,operation_status:r.payload?.operation_status||'',warehouse_dispatched:r.payload?.warehouse_dispatched===true}));document.getElementById('view-operations').innerHTML=card('Operation / طلبات المخزن',kpis([['إجمالي الطلبات',rows.length],['Pending',mapped.filter(x=>String(x.status).toLowerCase()==='pending').length],['Approved',mapped.filter(x=>String(x.approval_status).toLowerCase()==='approved').length],['Dispatched',mapped.filter(x=>x.warehouse_dispatched||String(x.operation_status).toLowerCase()==='dispatched').length]])+table([['التاريخ','order_date'],['العميل','customer_name'],['المندوب','rep_name'],['المنتج','product_name'],['الكمية',r=>qty(r.qty)],['الإجمالي',r=>money(r.total)],['Status','status'],['Approval','approval_status'],['Operation','operation_status']],mapped))}
async function renderPurchases(){let rows=await get('purchases',()=>q('mahsoubak_purchases','id,purchase_date,supplier_name,invoice_number,product_name,lot_number,qty,unit_cost,total,paid,remaining,status','order=purchase_date.desc'));document.getElementById('view-purchases').innerHTML=card('المشتريات',kpis([['عدد السطور',rows.length],['الإجمالي',money(rows.reduce((a,r)=>a+n(r.total),0))],['المدفوع',money(rows.reduce((a,r)=>a+n(r.paid),0))],['المتبقي',money(rows.reduce((a,r)=>a+n(r.remaining),0))]])+table([['التاريخ','purchase_date'],['المورد','supplier_name'],['الفاتورة','invoice_number'],['المنتج','product_name'],['الكمية',r=>qty(r.qty)],['التكلفة',r=>money(r.unit_cost)],['الإجمالي',r=>money(r.total)],['المتبقي',r=>money(r.remaining)],['الحالة','status']],rows))}
async function renderSales(){let rows=await get('invoices',()=>q('mahsoubak_app_invoice_detail','*','order=invoice_date.desc'));document.getElementById('view-sales').innerHTML=card('الفواتير / Orders',kpis([['الفواتير',rows.length],['المبيعات',money(rows.reduce((a,r)=>a+n(r.invoice_total),0))],['المدفوع',money(rows.reduce((a,r)=>a+n(r.paid),0))],['المتبقي',money(rows.reduce((a,r)=>a+n(r.remaining),0))]])+table([['التاريخ','invoice_date'],['الفاتورة','invoice_ref'],['العميل','customer_name'],['السطور','line_count'],['الكمية',r=>qty(r.qty)],['الإجمالي',r=>money(r.invoice_total)],['المدفوع',r=>money(r.paid)],['المتبقي',r=>money(r.remaining)],['الحالة','invoice_status']],rows))}
async function renderCollections(){let rows=await get('collections',()=>q('mahsoubak_app_collection_detail','*','order=collection_date.desc'));document.getElementById('view-collections').innerHTML=card('التحصيلات',kpis([['عدد التحصيلات',rows.length],['Cash',money(rows.reduce((a,r)=>a+n(r.cash_received),0))],['Applied',money(rows.reduce((a,r)=>a+n(r.applied_to_invoices),0))],['Unapplied',money(rows.reduce((a,r)=>a+n(r.unapplied_customer_credit),0))]])+table([['التاريخ','collection_date'],['العميل','customer_name'],['Cash',r=>money(r.cash_received)],['Applied',r=>money(r.applied_to_invoices)],['Unapplied',r=>money(r.unapplied_customer_credit)],['الحالة','approval_status']],rows))}
async function renderReports(){let rows=await get('invoices',()=>q('mahsoubak_app_invoice_detail','*','order=invoice_date.desc'));let e=document.getElementById('view-reports');e.innerHTML=card('التقارير',`<div class="clean-toolbar"><input id="rf" type="date"><input id="rt" type="date"><button class="btn" onclick="applyReport()">تطبيق</button><button class="btn secondary" onclick="exportReport()">تصدير CSV</button></div><div id="reportBody"></div>`);window.__reportRows=rows;applyReport()}
function applyReport(){let f=document.getElementById('rf')?.value||'',t=document.getElementById('rt')?.value||'';let rows=(window.__reportRows||[]).filter(r=>(!f||r.invoice_date>=f)&&(!t||r.invoice_date<=t));window.__reportFiltered=rows;document.getElementById('reportBody').innerHTML=kpis([['الفواتير',rows.length],['المبيعات',money(rows.reduce((a,r)=>a+n(r.invoice_total),0))],['المدفوع',money(rows.reduce((a,r)=>a+n(r.paid),0))],['المديونية',money(rows.reduce((a,r)=>a+n(r.remaining),0))]])+table([['التاريخ','invoice_date'],['الفاتورة','invoice_ref'],['العميل','customer_name'],['الإجمالي',r=>money(r.invoice_total)],['المدفوع',r=>money(r.paid)],['المتبقي',r=>money(r.remaining)]],rows)}
function exportReport(){let rows=window.__reportFiltered||[];let head=['date','invoice','customer','total','paid','remaining'];let out=[head.join(',')].concat(rows.map(r=>[r.invoice_date,r.invoice_ref,r.customer_name,r.invoice_total,r.paid,r.remaining].map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(','))).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+out],{type:'text/csv;charset=utf-8'}));a.download='mahsoubak_report.csv';a.click()}
async function renderAccounts(){let [t,e]=await Promise.all([get('treasury',()=>q('mahsoubak_app_treasury_movement_detail','*','order=transaction_date.desc')),get('expenses',()=>q('mahsoubak_app_expense_detail','*','order=expense_date.desc'))]);document.getElementById('view-accounts').innerHTML=card('المالية',kpis([['Cash In',money(t.filter(x=>x.movement_type==='CASH_IN').reduce((a,r)=>a+n(r.amount),0))],['Cash Out',money(t.filter(x=>x.movement_type==='CASH_OUT').reduce((a,r)=>a+n(r.amount),0))],['الرصيد',money(t.reduce((a,r)=>a+n(r.signed_amount),0))],['المصروفات',money(e.reduce((a,r)=>a+n(r.amount),0))]])+table([['التاريخ','transaction_date'],['النوع','movement_type'],['الطرف','party_name'],['المصدر','source_type'],['المبلغ',r=>money(r.amount)],['Signed',r=>money(r.signed_amount)],['التصنيف','classification']],t))}
async function renderTrial(){let rows=await get('trial',()=>q('mahsoubak_reporting_finance_trial_balance','*','order=account_code.asc'));document.getElementById('view-trial').innerHTML=card('ميزان المراجعة',kpis([['إجمالي مدين',money(rows.reduce((a,r)=>a+n(r.debit),0))],['إجمالي دائن',money(rows.reduce((a,r)=>a+n(r.credit),0))],['الفرق',money(rows.reduce((a,r)=>a+n(r.debit)-n(r.credit),0))],['الحسابات',rows.length]])+table([['الكود','account_code'],['الحساب','account_name'],['الحركات','line_count'],['مدين',r=>money(r.debit)],['دائن',r=>money(r.credit)],['الرصيد',r=>money(r.balance)]],rows))}
async function renderRegions(){let [d,t]=await Promise.all([get('terr',()=>q('mahsoubak_app_territory_sales')),get('terrt',()=>q('mahsoubak_app_territory_totals'))]);document.getElementById('view-regions').innerHTML=card('المناطق',kpis(t.map(r=>[r.territory_group,money(r.sales)]))+table([['المجموعة','territory_group'],['المنطقة','territory_code'],['المبيعات',r=>money(r.sales)],['الكمية',r=>qty(r.qty)],['المدفوع',r=>money(r.paid)],['المتبقي',r=>money(r.remaining)],['عدد المبيعات','sale_count']],d))}
async function renderSettings(){let [h,p]=await Promise.all([q('mahsoubak_app_phase6f6_health'),rpc('mahsoubak_browser_preflight_v1',{}).catch(()=>null)]);let x=h[0]||{};document.getElementById('view-settings').innerHTML=card('الإعدادات / صحة النظام',kpis([['App Contract',x.phase6f6_status||'-'],['Sales Difference',money(x.sales_card_detail_difference)],['Receivable Difference',money(x.receivable_card_detail_difference)],['Inventory Difference',money(x.inventory_value_card_detail_difference)]])+(p?'<pre style="direction:ltr;text-align:left;white-space:pre-wrap">'+esc(JSON.stringify(p,null,2))+'</pre>':''))}
const renderers={dashboard:renderDashboard,products:renderProducts,customers:renderCustomers,suppliers:renderSuppliers,reps:renderReps,operations:renderOperations,purchases:renderPurchases,sales:renderSales,collections:renderCollections,reports:renderReports,accounts:renderAccounts,trial:renderTrial,regions:renderRegions,settings:renderSettings};
window.addEventListener('DOMContentLoaded',async()=>{nav();try{let h=await q('mahsoubak_app_phase6f6_health');if(!h[0]||h[0].phase6f6_status!=='PHASE6F6_APP_READ_CONTRACT_MATCH')throw new Error('Canonical contract not MATCH');setStatus('Canonical App Contract MATCH');await show('dashboard')}catch(e){console.error(e);setStatus('Load failed',true);document.getElementById('view-dashboard').innerHTML='<div class="card"><h3>تعذر تحميل البيانات</h3><div class="empty">'+esc(e.message)+'</div></div>'}});
</script></body></html>
