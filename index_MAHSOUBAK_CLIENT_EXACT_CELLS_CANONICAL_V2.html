const REP_GROUPS={
  all_reps_total_v189:{name:'All Reps Total',group:null},
  west_total_v186:{name:'West Total',group:'West Total'},
  east_total_v186:{name:'East Total',group:'East Total'},
  delta_total_v321:{name:'Delta Total',group:'Delta Total'},
  alex_total_v321:{name:'Alexandria Total',group:'Alexandria Total'}
};
let repReportFilterV189={from:'',to:'',repId:'all_reps_total_v189'};
function rowDate(r){return S(r.sale_date||r.date||r.invoice_date).slice(0,10)}
function reportInRange(r){let d=rowDate(r);return (!repReportFilterV189.from||!d||d>=repReportFilterV189.from)&&(!repReportFilterV189.to||!d||d<=repReportFilterV189.to)}
function isBonusTargetRow(r){let t=norm(r.order_type||r.order_type_label||r.sale_type||r.type);return /bonus|بونص|display|عرض|sample|عين|free|مجاني/.test(t)}
function reportRows(ref){
  let rows=A(D.allocations).filter(reportInRange),g=REP_GROUPS[ref];
  if(g){
    if(!g.group)return rows;
    return rows.filter(r=>S(r.territory_group)===g.group);
  }
  let rep=A(D.reps).find(r=>S(r.id)===S(ref))||A(D.reps).find(r=>norm(r.name)===norm(ref));
  if(!rep)return rows.filter(r=>S(r.rep_id)===S(ref)||norm(r.rep_name)===norm(ref));
  return rows.filter(r=>S(r.rep_id)===S(rep.id)||norm(r.rep_name)===norm(rep.name));
}
function reportName(ref){
  if(REP_GROUPS[ref])return REP_GROUPS[ref].name;
  let rep=A(D.reps).find(r=>S(r.id)===S(ref))||A(D.reps).find(r=>norm(r.name)===norm(ref));
  return rep?S(rep.name):S(ref);
}
function invoiceKey(r){return S(r.invoice_key||r.invoice_number||r.invoice_no||r.order_id||r.sale_id||r.id)}
function distinctCount(rows,fn){return new Set(rows.map(fn).filter(Boolean)).size}
function repTargetValue(ref){
  let reps=A(D.reps).filter(r=>r.active!==false);
  if(ref==='all_reps_total_v189')return reps.reduce((a,r)=>a+N(r.target_qty??r.target??r.sales_target),0);
  let g=REP_GROUPS[ref];
  if(g&&g.group){
    let names=new Set(reportRows(ref).map(r=>norm(r.rep_name)));
    return reps.filter(r=>names.has(norm(r.name))).reduce((a,r)=>a+N(r.target_qty??r.target??r.sales_target),0);
  }
  let rep=reps.find(r=>S(r.id)===S(ref))||reps.find(r=>norm(r.name)===norm(ref));
  return rep?N(rep.target_qty??rep.target??rep.sales_target):0;
}
function groupByRegion(rows){
  let m=new Map();
  rows.forEach(r=>{
    let k=S(r.territory_code||r.region_code||'غير محدد');
    if(!m.has(k))m.set(k,{name:k,qty:0,sales:0,paid:0,remaining:0,invoices:new Set()});
    let x=m.get(k);x.qty+=N(r.allocated_qty??r.qty);x.sales+=N(r.allocated_total??r.total);x.remaining+=N(r.allocated_remaining??r.remaining);
    x.paid+=N(r.allocated_paid??Math.max(0,N(r.allocated_total??r.total)-N(r.allocated_remaining??r.remaining)));let ik=invoiceKey(r);if(ik)x.invoices.add(ik);
  });
  return Array.from(m.values()).sort((a,b)=>b.sales-a.sales);
}
function groupByCustomer(rows){
  let m=new Map();
  rows.forEach(r=>{
    let k=S(r.customer_id)||norm(r.customer_name);if(!m.has(k))m.set(k,{name:S(r.customer_name)||'-',sales:0,paid:0,remaining:0,qty:0,invoices:new Set()});
    let x=m.get(k);x.qty+=N(r.allocated_qty??r.qty);x.sales+=N(r.allocated_total??r.total);x.remaining+=N(r.allocated_remaining??r.remaining);x.paid+=N(r.allocated_paid??Math.max(0,N(r.allocated_total??r.total)-N(r.allocated_remaining??r.remaining)));let ik=invoiceKey(r);if(ik)x.invoices.add(ik);
  });
  return Array.from(m.values()).sort((a,b)=>b.sales-a.sales);
}
function groupInvoices(rows){
  let m=new Map();
  rows.forEach(r=>{
    let k=invoiceKey(r)||('ROW_'+S(r.sale_id||r.id));if(!m.has(k))m.set(k,{key:k,date:rowDate(r),customer:S(r.customer_name),products:new Set(),qty:0,total:0,paid:0,remaining:0});
    let x=m.get(k);if(r.product_name)x.products.add(S(r.product_name));x.qty+=N(r.allocated_qty??r.qty);x.total+=N(r.allocated_total??r.total);x.remaining+=N(r.allocated_remaining??r.remaining);x.paid+=N(r.allocated_paid??Math.max(0,N(r.allocated_total??r.total)-N(r.allocated_remaining??r.remaining)));
  });
  return Array.from(m.values()).sort((a,b)=>S(b.date).localeCompare(S(a.date)));
}
function buildReportV189(ref){
