<style>
*{box-sizing:border-box}
:root{
 --bg:#f5f6f8;--card:#fff;--line:#e5e7eb;--text:#1f2937;--muted:#64748b;
 --side:#744a68;--side2:#5f3b55;--ok:#15803d;--warn:#b45309;--danger:#b91c1c;--blue:#2563eb
}
html,body{margin:0;min-height:100%;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font-family:inherit}
.app{min-height:100vh;display:grid;grid-template-columns:1fr 260px}
.side{grid-column:2;grid-row:1;background:linear-gradient(180deg,var(--side),var(--side2));color:#fff;padding:18px 14px;height:100vh;position:sticky;top:0;overflow:auto}
.main{grid-column:1;grid-row:1;padding:22px;min-width:0}
html[dir="ltr"] .app{grid-template-columns:260px 1fr}
html[dir="ltr"] .side{grid-column:1}
html[dir="ltr"] .main{grid-column:2}
.brand{padding:5px 8px 16px;border-bottom:1px solid #ffffff2a;margin-bottom:12px}
.brand h1{font-size:20px;margin:0 0 5px}.brand p{font-size:11px;opacity:.82;margin:0}
.lang-btn{background:#ffffff18;border:1px solid #ffffff2f;color:#fff;border-radius:10px;padding:9px 11px;width:100%;font-weight:900;cursor:pointer;margin-top:10px}
.nav{display:grid;gap:5px}
.nav button{border:0;background:transparent;color:#fff;padding:11px;border-radius:10px;font-weight:800;cursor:pointer}
html[dir="rtl"] .nav button{text-align:right}html[dir="ltr"] .nav button{text-align:left}
.nav button:hover,.nav button.active{background:#ffffff24}
.status{margin-top:16px;padding:10px;border-radius:10px;background:#ffffff16;font-size:11px;white-space:pre-line;line-height:1.6}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.top h2{margin:0;font-size:24px}.top p{margin:5px 0 0;color:var(--muted);font-size:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:900;cursor:pointer}
.btn.primary{background:var(--side);color:#fff}.btn.blue{background:var(--blue);color:#fff}.btn.ok{background:#16a34a;color:#fff}
.btn.secondary{background:#fff;border:1px solid var(--line);color:var(--text)}.btn.danger{background:#fee2e2;color:#991b1b}
.btn.small{padding:7px 9px;font-size:11px}
.health{display:flex;align-items:center;gap:8px;padding:10px 13px;background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:14px;font-size:12px;font-weight:800}
.dot{width:9px;height:9px;border-radius:50%;background:#9ca3af}.dot.ok{background:#16a34a}.dot.bad{background:#dc2626}
.section{display:none}.section.active{display:block}
.grid{display:grid;grid-template-columns:repeat(3,minmax(220px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:0 8px 24px #0f172a0d}
.kpi{cursor:pointer;min-height:170px;transition:.16s}.kpi:hover{transform:translateY(-2px);box-shadow:0 12px 30px #0f172a17}
.kpi-title{font-size:16px;font-weight:900}.kpi-sub{font-size:11px;color:var(--muted);margin-top:4px}.kpi-value{font-size:25px;font-weight:900;margin:20px 0 12px}
.metrics{display:grid;gap:7px}.metric{display:flex;justify-content:space-between;gap:10px;font-size:11px}.metric span{color:var(--muted)}
.placeholder{background:#fff;border:1px dashed #cbd5e1;border-radius:18px;padding:30px;text-align:center;color:var(--muted)}
.module-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.module-head h3{margin:0;font-size:20px}.module-head p{margin:5px 0 0;color:var(--muted);font-size:12px}
.module-tools{display:flex;gap:8px;flex-wrap:wrap}
.input,.select{border:1px solid #d1d5db;background:#fff;border-radius:10px;padding:10px 12px;min-width:170px;color:var(--text)}
.module-grid{display:grid;grid-template-columns:repeat(4,minmax(180px,1fr));gap:12px;margin-bottom:14px}
.mini-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer}
.mini-card span{display:block;color:var(--muted);font-size:11px}.mini-card b{display:block;margin-top:6px;font-size:20px}
.table-card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 8px 24px #0f172a0d}
.table-wrap{overflow:auto}.data-table{width:100%;border-collapse:collapse;min-width:900px}
.data-table th,.data-table td{padding:11px 12px;border-bottom:1px solid #eef2f7;font-size:12px;white-space:nowrap}
html[dir="rtl"] .data-table th,html[dir="rtl"] .data-table td{text-align:right}
html[dir="ltr"] .data-table th,html[dir="ltr"] .data-table td{text-align:left}
.data-table th{background:#f8fafc;color:#475569}.data-table tr:hover td{background:#fafafa}
.product-name{font-weight:900}.empty{padding:30px;text-align:center;color:var(--muted)}
.pill{display:inline-flex;align-items:center;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:900}
.pill.ok{background:#ecfdf5;color:#166534}.pill.low{background:#fff7ed;color:#9a3412}.pill.zero{background:#fef2f2;color:#991b1b}
.modal{display:none;position:fixed;inset:0;background:#0f172a7a;z-index:99;padding:28px;align-items:center;justify-content:center}
.modal.show{display:flex}.panel{background:#fff;border-radius:20px;width:min(1050px,100%);max-height:90vh;overflow:auto}
.panel-head{display:flex;justify-content:space-between;align-items:center;padding:18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:3}
.panel-body{padding:18px}.detail-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.detail{background:#f8fafc;border:1px solid var(--line);border-radius:13px;padding:13px}.detail span{display:block;color:var(--muted);font-size:11px}.detail b{display:block;margin-top:5px;font-size:18px}
.error{display:none;background:#fef2f2;color:#991b1b;border:1px solid #fecaca;border-radius:12px;padding:11px 13px;margin-bottom:14px;white-space:pre-wrap}
.loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#f5f6f8;z-index:999}
.loading div{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 24px;font-weight:900}

/* Rep reports */
.rep-shell{display:grid;grid-template-columns:270px 1fr;gap:14px;align-items:start}
html[dir="ltr"] .rep-shell{grid-template-columns:270px 1fr}
.rep-list{display:grid;gap:8px;position:sticky;top:16px}
.rep-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;transition:.15s}
.rep-card:hover,.rep-card.active{border-color:#8b5cf6;box-shadow:0 8px 22px #8b5cf61f}
.rep-card b{display:block;font-size:13px}.rep-card span{display:block;color:var(--muted);font-size:10px;margin-top:4px}
.rep-main{min-width:0}.report-filter{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.filter-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:end}
.filter-grid label{display:grid;gap:5px;font-size:11px;color:var(--muted);font-weight:800}
.report-banner{background:#ecfdf5;border:1px solid #86efac;border-radius:16px;padding:14px 16px;margin-bottom:12px}
.report-banner span{font-size:11px;color:#166534}.report-banner strong{display:block;font-size:26px;color:#166534;margin-top:5px}
.report-kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:12px}
.report-kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;transition:.15s}
.report-kpi:hover,.report-banner:hover{transform:translateY(-1px);border-color:#8b5cf6;box-shadow:0 9px 24px #8b5cf61f}
.report-banner{cursor:pointer;transition:.15s}
.report-kpi span{display:block;color:var(--muted);font-size:10px}.report-kpi b{display:block;margin-top:5px;font-size:17px}
.progress{height:8px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;background:#16a34a}
.report-section{margin-top:12px}
.report-section h4{margin:0;padding:13px 15px;background:#fff;border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0}
.report-section .table-card{border-radius:0 0 14px 14px}

.company-sales-hero{background:#ecfdf5;border:1px solid #86efac;border-radius:18px;padding:16px 18px;margin-bottom:12px;cursor:pointer;transition:.15s}
.company-sales-hero:hover{transform:translateY(-1px);box-shadow:0 10px 28px #16a34a1f}
.company-sales-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin-bottom:12px}
.company-sales-head span{font-size:11px;color:#166534;font-weight:800}.company-sales-head strong{font-size:28px;color:#166534}
.company-target-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.company-target-cell{background:#fff;border:1px solid #bbf7d0;border-radius:12px;padding:10px;cursor:pointer}

@media(max-width:720px){.company-target-grid,.company-groups{grid-template-columns:1fr}.company-sales-head{flex-direction:column}}

.rep-report-tile h3{margin:0}.rep-report-tile p{margin:5px 0 0;color:var(--muted);font-size:12px}

}
@media(max-width:1100px){.grid{grid-template-columns:repeat(2,1fr)}.module-grid{grid-template-columns:repeat(2,1fr)}.report-kpis{grid-template-columns:repeat(3,1fr)}.filter-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:850px){.rep-shell{grid-template-columns:1fr}.rep-list{position:static;grid-template-columns:repeat(2,1fr)}}
@media(max-width:720px){.app{display:block}.side{height:auto;position:relative}.main{padding:14px}.grid,.module-grid,.report-kpis,.filter-grid,.detail-grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.rep-list{grid-template-columns:1fr}}

async function getAll(view){

 while(true){
  const r=await fetch(`${SB_URL}/rest/v1/${encodeURIComponent(view)}?select=*&limit=${limit}&offset=${offset}`,{headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY},cache:'no-store'});
  const text=await r.text();let rows=[];
  try{rows=text?JSON.parse(text):[]}catch(e){throw new Error(view+' returned invalid JSON')}
  if(!r.ok)throw new Error(view+': '+(rows?.message||text||r.status));
  out.push(...A(rows));if(rows.length<limit)break;offset+=limit;if(offset>30000)throw new Error(view+': pagination stop');
 }
 return out;
}

const GROUPS=[

];
function repNameById(id){const r=A(D.repMaster).find(x=>S(x.id)===S(id));return r?S(r.name||r.rep_name):S(id)}

function dateInRange(v,from,to){const d=S(v).slice(0,10);if(from&&d<from)return false;if(to&&d>to)return false;return true}
function allocationRowsForRef(ref,from='',to=''){
 let rows=A(D.allocations).filter(r=>dateInRange(r.sale_date||r.date,from,to));
 if(ref==='all')return rows;
 const g=GROUPS.find(x=>x.id===ref);
 if(g)return rows.filter(r=>g.sourceGroups.includes(S(r.territory_group)));

}
function canonicalGroupFromTerritory(v){
 const x=norm(v).replace(/\s/g,'');
 if(x.includes('west1')||x.includes('west2')||x==='westtotal')return 'West Total';
 if(x.includes('east1')||x.includes('east2')||x.includes('heliopolis')||x.includes('مصرالجديده')||x==='easttotal')return 'East Total';
 if(x.includes('delta')||x.includes('دلتا'))return 'Delta Total';
 if(x.includes('alex')||x.includes('اسكندري')||x.includes('الاسكندري'))return 'Alexandria Total';
 return '';
}
function repCurrentGroup(rep){

}
function repsForRef(ref,rows){
 if(ref==='all')return A(D.repMaster).filter(r=>r.active!==false);
 if(GROUPS.some(g=>g.id===ref)){
   const current=A(D.repMaster).filter(r=>r.active!==false&&repCurrentGroup(r)===ref);
   if(current.length)return current;
   const names=new Set(rows.map(r=>norm(r.rep_name)).filter(Boolean));
   return A(D.repMaster).filter(r=>names.has(norm(r.name||r.rep_name)));
 }

 const {from,to}=REPORT_STATE,c=companyStats(from,to);
 const groupTable=table([
   [T('region'),r=>`<b>${esc(refLabel(r.group))}</b>`],
   [T('salesAmount'),r=>money(r.sales)],
   [T('qty'),r=>num(r.qty,2)],
   [T('invoiceCount'),r=>num(r.invoices,0)],
   [T('target'),r=>num(r.qtyTarget,2)],
   [T('achievement'),r=>r.qtyPct.toFixed(1)+'%'],
   [T('moneyTarget'),r=>r.mTarget===null?T('notSet'):money(r.mTarget)]
 ],['West Total','East Total','Delta Total','Alexandria Total'].map(g=>companyGroupStats(g,from,to)));
 const summaryHtml=`<div class="detail-grid">
   ${detail(T('salesAmount'),money(c.sales))}
   ${detail(T('qtyTarget'),num(c.qtyTarget,2))}
   ${detail(T('qtyAchieved'),num(c.qty,2))}
   ${detail(T('qtyRemaining'),num(c.qtyRemaining,2))}
   ${detail(T('qtyAchievement'),c.qtyPct.toFixed(1)+'%')}
   ${detail(T('moneyTarget'),c.moneyTarget===null?T('notSet'):money(c.moneyTarget))}
   ${detail(T('moneyRemaining'),c.moneyRemaining===null?T('notSet'):money(c.moneyRemaining))}
   ${detail(T('moneyAchievement'),c.moneyTarget?c.moneyPct.toFixed(1)+'%':T('notSet'))}
  </div><div style="margin-top:14px">${companyBreakdownHtml(from,to)}</div><div class="report-section"><h4>${T('companyBreakdown')}</h4>${groupTable}</div>`;
 openModal(T('companyAllSales'),summaryHtml);
}
function table(headers,rows){
 if(!rows.length)return `<div class="empty">${T('noData')}</div>`;
 return `<div class="table-card"><div class="table-wrap"><table class="data-table"><thead><tr>${headers.map(h=>`<th>${h[0]}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${headers.map(h=>`<td>${h[1](r)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;
}
function reportCardHtml(ref,from='',to=''){
 REPORT_STATE={ref,from,to};
 const rows=allocationRowsForRef(ref,from,to),collections=collectionRowsForRef(ref,from,to),invoices=groupInvoices(rows),customers=customerSummary(rows),regions=regionSummary(rows);
 const sales=rows.reduce((a,r)=>a+N(r.allocated_total),0),remaining=rows.reduce((a,r)=>a+N(r.allocated_remaining),0),paid=sales-remaining;
 const target=reportTarget(ref,rows),ach=reportAchieved(rows),left=Math.max(0,target-ach),pct=target?ach/target*100:0;
 const collectionCash=collections.reduce((a,r)=>a+N(r.cash_received??r.amount),0);
 return `
 ${companySalesHero(from,to)}
 ${ref==='all'?'':`<div class="report-banner" onclick="openReportKpi('sales')" title="${T('clickForDetails')}"><span>${T('selectedScope')} — ${esc(refLabel(ref))}</span><strong>${money(sales)}</strong></div>`}
 <div class="report-kpis">
  <div class="report-kpi" onclick="openReportKpi('paid')" title="${T('clickForDetails')}"><span>${T('paid')}</span><b>${money(paid)}</b></div>
  <div class="report-kpi" onclick="openReportKpi('remaining')" title="${T('clickForDetails')}"><span>${T('remaining')}</span><b>${money(remaining)}</b></div>
  <div class="report-kpi" onclick="openReportKpi('invoices')" title="${T('clickForDetails')}"><span>${T('invoiceCount')}</span><b>${num(invoices.length,0)}</b></div>
  <div class="report-kpi" onclick="openReportKpi('collections')" title="${T('clickForDetails')}"><span>${T('collectionsDirect')}</span><b>${money(collectionCash)}</b></div>
  <div class="report-kpi" onclick="openReportKpi('qty')" title="${T('clickForDetails')}"><span>${T('qty')}</span><b>${num(rows.reduce((a,r)=>a+N(r.allocated_qty),0),2)}</b></div>
 </div>
 <div class="report-kpis">
  <div class="report-kpi" onclick="openReportKpi('target')" title="${T('clickForDetails')}"><span>${T('target')}</span><b>${num(target,2)}</b></div>
  <div class="report-kpi" onclick="openReportKpi('achieved')" title="${T('clickForDetails')}"><span>${T('achieved')}</span><b>${num(ach,2)}</b></div>
  <div class="report-kpi" onclick="openReportKpi('target_remaining')" title="${T('clickForDetails')}"><span>${T('targetRemaining')}</span><b>${num(left,2)}</b></div>
  <div class="report-kpi" onclick="openReportKpi('achievement')" title="${T('clickForDetails')}"><span>${T('achievement')}</span><b>${pct.toFixed(1)}%</b><div class="progress"><i style="width:${Math.min(100,Math.max(0,pct))}%"></i></div></div>
  <div class="report-kpi" onclick="openReportKpi('money_target')" title="${T('clickForDetails')}"><span>${T('moneyTarget')}</span><b>${moneyTargetForRef(ref)===null?T('notSet'):money(moneyTargetForRef(ref))}</b></div>
 </div>
 <div class="report-section"><h4>${T('regionAnalysis')}</h4>${table([
   [T('region'),r=>`<b>${esc(r.name)}</b>`],[T('qty'),r=>num(r.qty,2)],[T('salesAmount'),r=>money(r.sales)],[T('remaining'),r=>money(r.remaining)],[T('invoiceCount'),r=>num(r.invoices.size,0)]
 ],regions)}</div>
 <div class="report-section"><h4>${T('invoices')}</h4>${table([
   [T('date'),r=>esc(r.date)],[T('invoice'),r=>`<b>${esc(r.key)}</b>`],[T('customer'),r=>esc(r.customer)],[T('region'),r=>esc(r.region||'-')],[T('qty'),r=>num(r.qty,2)],[T('salesAmount'),r=>money(r.sales)],[T('remaining'),r=>money(r.remaining)]
 ],invoices)}</div>
 <div class="report-section"><h4>${T('customersAnalysis')}</h4>${table([
   [T('customer'),r=>`<b>${esc(r.name)}</b>`],[T('qty'),r=>num(r.qty,2)],[T('salesAmount'),r=>money(r.sales)],[T('remaining'),r=>money(r.remaining)],[T('invoiceCount'),r=>num(r.invoices.size,0)]
 ],customers)}</div>
 <div class="report-section"><h4>${T('collectionRecords')}</h4>${table([
   [T('date'),r=>esc(r.collection_date||r.date)],[T('customer'),r=>esc(r.customer_name)],[T('collection'),r=>money(r.cash_received??r.amount)],[T('method'),r=>esc(r.method||'-')],[T('notes'),r=>esc(r.notes||'-')]
 ],collections)}</div>`;
}
function reportTargetBreakdown(){
 const {ref,from,to}=REPORT_STATE,rows=allocationRowsForRef(ref,from,to),reps=repsForRef(ref,rows);
 return reps.map(rep=>{
  const repRows=rows.filter(r=>S(r.rep_id)===S(rep.id)||norm(r.rep_name)===norm(rep.name||rep.rep_name));
  const target=repTargetValue(rep),ach=reportAchieved(repRows),left=Math.max(0,target-ach),pct=target?ach/target*100:0;
  return {name:S(rep.name||rep.rep_name),region:S(rep.region_code||rep.territory_code||'-'),target,ach,left,pct,sales:repRows.reduce((a,r)=>a+N(r.allocated_total),0),remaining:repRows.reduce((a,r)=>a+N(r.allocated_remaining),0)};
 });
}
function openReportKpi(kind){
 const {ref,from,to}=REPORT_STATE,rows=allocationRowsForRef(ref,from,to),collections=collectionRowsForRef(ref,from,to),invoices=groupInvoices(rows);
 const salesLines=table([
  [T('date'),r=>esc(S(r.sale_date||r.date).slice(0,10))],
  [T('invoice'),r=>esc(r.invoice_key||r.invoice_number||r.invoice_no||r.sale_id)],
  [T('customer'),r=>esc(r.customer_name)],
  [T('rep'),r=>esc(r.rep_name)],
  [T('region'),r=>esc(r.territory_code||'-')],
  [T('product'),r=>esc(r.product_name||'-')],
  [T('qty'),r=>num(r.allocated_qty,2)],
  [T('salesAmount'),r=>money(r.allocated_total)],
  [T('remaining'),r=>money(r.allocated_remaining)]
 ],rows);
 const invoiceTable=(source)=>table([
  [T('date'),r=>esc(r.date)],[T('invoice'),r=>`<b>${esc(r.key)}</b>`],[T('customer'),r=>esc(r.customer)],
  [T('region'),r=>esc(r.region||'-')],[T('qty'),r=>num(r.qty,2)],[T('salesAmount'),r=>money(r.sales)],
  [T('paid'),r=>money(Math.max(0,N(r.sales)-N(r.remaining)))],[T('remaining'),r=>money(r.remaining)]
 ],source);
 const targetRows=reportTargetBreakdown();
 const targetTable=table([
  [T('rep'),r=>`<b>${esc(r.name)}</b>`],[T('region'),r=>esc(r.region)],[T('target'),r=>num(r.target,2)],
  [T('achieved'),r=>num(r.ach,2)],[T('targetRemaining'),r=>num(r.left,2)],[T('achievement'),r=>r.pct.toFixed(1)+'%'],
  [T('salesAmount'),r=>money(r.sales)],[T('remaining'),r=>money(r.remaining)]
 ],targetRows);

 if(kind==='sales'){openModal(T('salesDetails')+' — '+refLabel(ref),salesLines);return}
 if(kind==='paid'){openModal(T('paidDetails')+' — '+refLabel(ref),invoiceTable(invoices.filter(r=>Math.max(0,N(r.sales)-N(r.remaining))>0)));return}
 if(kind==='remaining'){openModal(T('remainingDetails')+' — '+refLabel(ref),invoiceTable(invoices.filter(r=>N(r.remaining)>0)));return}
 if(kind==='invoices'){openModal(T('invoices')+' — '+refLabel(ref),invoiceTable(invoices));return}
 if(kind==='collections'){openModal(T('collectionRecords')+' — '+refLabel(ref),table([
   [T('date'),r=>esc(r.collection_date||r.date)],[T('customer'),r=>esc(r.customer_name)],[T('rep'),r=>esc(r.rep_name||'-')],
   [T('collection'),r=>money(r.cash_received??r.amount)],[T('method'),r=>esc(r.method||'-')],[T('notes'),r=>esc(r.notes||'-')]
 ],collections));return}
 if(kind==='qty'){openModal(T('quantityDetails')+' — '+refLabel(ref),salesLines);return}
 if(kind==='target'||kind==='target_remaining'){openModal(T('targetDetails')+' — '+refLabel(ref),targetTable);return}
 if(kind==='achieved'||kind==='achievement'){openModal(T('achievementDetails')+' — '+refLabel(ref),targetTable);return}
 if(kind==='money_target'){const mt=moneyTargetForRef(ref),sales=rows.reduce((a,r)=>a+N(r.allocated_total),0),rem=mt===null?null:Math.max(0,mt-sales),pct=mt?sales/mt*100:0;openModal(T('moneyTarget')+' — '+refLabel(ref),`<div class="detail-grid">${detail(T('moneyTarget'),mt===null?T('notSet'):money(mt))}${detail(T('moneyAchieved'),money(sales))}${detail(T('moneyRemaining'),rem===null?T('notSet'):money(rem))}${detail(T('moneyAchievement'),mt?pct.toFixed(1)+'%':T('notSet'))}</div>`);return}
}
function refCard(ref){
 const rows=allocationRowsForRef(ref),sales=rows.reduce((a,r)=>a+N(r.allocated_total),0),remaining=rows.reduce((a,r)=>a+N(r.allocated_remaining),0);
 return `<div class="rep-card ${selectedRepRef===ref?'active':''}" onclick="selectRepRef('${esc(ref)}')"><b>${esc(refLabel(ref))}</b><span>${T('salesAmount')}: ${money(sales)}</span><span>${T('remaining')}: ${money(remaining)}</span></div>`;
}
function renderRepReports(){
 const refs=reportRefs();
 $('view-rep_reports').innerHTML=`<div class="module-head"><div><h3>${T('repReportTitle')}</h3><p>${T('repReportSub')}</p></div><button class="btn blue no-print" onclick="window.print()">${T('print')}</button></div>
 <div class="rep-shell">
  <div class="rep-list"><div class="card" style="padding:12px"><b>${T('repList')}</b></div>${refs.map(x=>refCard(x.id)).join('')}</div>
  <div class="rep-main">
   <div class="report-filter no-print"><div class="filter-grid">
    <label>${T('from')}<input id="repFrom" class="input" type="date"></label>
    <label>${T('to')}<input id="repTo" class="input" type="date"></label>
    <label>${T('rep')}<select id="repSelect" class="select">${refs.map(x=>`<option value="${esc(x.id)}">${esc(x.labelKey?T(x.labelKey):x.name)}</option>`).join('')}</select></label>
    <button class="btn ok" onclick="applyRepFilter()">${T('apply')}</button>
   </div></div>
   <div id="repReportBody"></div>
  </div>
 </div>`;
 $('repSelect').value=selectedRepRef;
 $('repReportBody').innerHTML=reportCardHtml(selectedRepRef);
}
function selectRepRef(ref){selectedRepRef=ref;renderRepReports()}
function applyRepFilter(){
 const ref=S($('repSelect').value)||'all',from=S($('repFrom').value),to=S($('repTo').value);
 if(from&&to&&from>to){alert(LANG==='ar'?'تاريخ البداية يجب أن يكون قبل تاريخ النهاية':'From date must be before To date');return}
 selectedRepRef=ref;REPORT_STATE={ref,from,to};
 document.querySelectorAll('.rep-card').forEach(x=>x.classList.toggle('active',S(x.getAttribute('onclick')).includes(`'${ref}'`)));
 $('repReportBody').innerHTML=reportCardHtml(ref,from,to);
}

/* contract */
function validate(){
 const s=summary(),h=health(),a=A(D.allocations),as=a.reduce((x,r)=>x+N(r.allocated_total),0),ar=a.reduce((x,r)=>x+N(r.allocated_remaining),0),rs=A(D.repSales).reduce((x,r)=>x+N(r.sales),0);
 const ok=S(h.phase6f6_status)==='PHASE6F6_APP_READ_CONTRACT_MATCH'&&Math.abs(as-N(s.company_sales))<=.01&&Math.abs(ar-N(s.receivables_from_sales||s.invoice_remaining))<=.01&&Math.abs(rs-N(s.company_sales))<=.01;
 $('healthDot').className='dot '+(ok?'ok':'bad');
 $('healthText').textContent=ok?`Canonical Contract MATCH • Sales ${money(s.company_sales)} • Remaining ${money(s.receivables_from_sales||s.invoice_remaining)}`:T('contractCheck');
 return ok;
}
async function loadData(manual=false){
 try{
  $('error').style.display='none';$('status').textContent=LANG==='ar'?'جاري تحميل البيانات…':'Loading canonical data…';
  const [summaryRows,healthRows,inventoryRows,orderRows,repSalesRows,repMasterRows,purchaseRows,allocationRows,collectionRows,territorySalesRows,territoryTotalsRows,moneyTargetRows]=await Promise.all([
   getAll(V.summary),getAll(V.health),getAll(V.inventory),getAll(V.orders),getAll(V.repSales),getAll(V.repMaster),
   getAll(V.purchases),getAll(V.allocations),getAll(V.collections),getAll(V.territorySales),getAll(V.territoryTotals),getAll(V.moneyTargets)
  ]);
  Object.assign(D,{summary:summaryRows,health:healthRows,inventory:inventoryRows,orders:orderRows,repSales:repSalesRows,repMaster:repMasterRows,purchases:purchaseRows,allocations:allocationRows,collections:collectionRows,territorySales:territorySalesRows,territoryTotals:territoryTotalsRows,moneyTargets:moneyTargetRows});
  if(!validate())throw new Error('Canonical contract validation failed');
  renderDashboard();renderProducts();renderSalesTarget();renderRepReports();
  $('status').textContent=T('connected')+'\n'+new Date().toLocaleTimeString(LANG==='ar'?'ar-EG':'en-GB');
  $('loading').style.display='none';
  if(manual)alert(LANG==='ar'?'تم تحديث البيانات':'Data refreshed');
 }catch(e){
  console.error(e);$('loading').style.display='none';$('error').style.display='block';$('error').textContent=T('loadError')+'\n'+e.message;$('status').textContent=T('connectionError');
 }
}
applyLanguage();loadData();
</script>
