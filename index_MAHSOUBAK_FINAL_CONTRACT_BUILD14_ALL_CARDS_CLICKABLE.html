<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STEP19B — Mahsoubak Business — Step 04 Rep Reports</title>
<style>
*{box-sizing:border-box}
:root{
 --bg:#f5f6f8;--card:#fff;--line:#e5e7eb;--text:#1f2937;--muted:#64748b;
 --side:#744a68;--side2:#5f3b55;--ok:#15803d;--warn:#b45309;--danger:#b91c1c;--blue:#2563eb
}
html,body{margin:0;min-height:100%;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font-family:inherit}
.app{min-height:100vh;display:grid;grid-template-columns:1fr 260px}
.side{grid-column:2;grid-row:1;background:linear-gradient(180deg,var(--side),var(--side2));color:#fff;padding:18px 14px;height:100vh;position:sticky;top:0;overflow:auto}
.main{grid-column:1;grid-row:1;padding:22px;min-width:0}
html[dir="ltr"] .app{grid-template-columns:260px 1fr}
html[dir="ltr"] .side{grid-column:1}
html[dir="ltr"] .main{grid-column:2}
.brand{padding:5px 8px 16px;border-bottom:1px solid #ffffff2a;margin-bottom:12px}
.brand h1{font-size:20px;margin:0 0 5px}.brand p{font-size:11px;opacity:.82;margin:0}
.lang-btn{background:#ffffff18;border:1px solid #ffffff2f;color:#fff;border-radius:10px;padding:9px 11px;width:100%;font-weight:900;cursor:pointer;margin-top:10px}
.nav{display:grid;gap:5px}
.nav button{border:0;background:transparent;color:#fff;padding:11px;border-radius:10px;font-weight:800;cursor:pointer}
html[dir="rtl"] .nav button{text-align:right}html[dir="ltr"] .nav button{text-align:left}
.nav button:hover,.nav button.active{background:#ffffff24}
.status{margin-top:16px;padding:10px;border-radius:10px;background:#ffffff16;font-size:11px;white-space:pre-line;line-height:1.6}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.top h2{margin:0;font-size:24px}.top p{margin:5px 0 0;color:var(--muted);font-size:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:900;cursor:pointer}
.btn.primary{background:var(--side);color:#fff}.btn.blue{background:var(--blue);color:#fff}.btn.ok{background:#16a34a;color:#fff}
.btn.secondary{background:#fff;border:1px solid var(--line);color:var(--text)}.btn.danger{background:#fee2e2;color:#991b1b}
.btn.small{padding:7px 9px;font-size:11px}
.health{display:flex;align-items:center;gap:8px;padding:10px 13px;background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:14px;font-size:12px;font-weight:800}
.dot{width:9px;height:9px;border-radius:50%;background:#9ca3af}.dot.ok{background:#16a34a}.dot.bad{background:#dc2626}
.section{display:none}.section.active{display:block}
.grid{display:grid;grid-template-columns:repeat(3,minmax(220px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:0 8px 24px #0f172a0d}
.kpi{cursor:pointer;min-height:170px;transition:.16s}.kpi:hover{transform:translateY(-2px);box-shadow:0 12px 30px #0f172a17}
.kpi-title{font-size:16px;font-weight:900}.kpi-sub{font-size:11px;color:var(--muted);margin-top:4px}.kpi-value{font-size:25px;font-weight:900;margin:20px 0 12px}
.metrics{display:grid;gap:7px}.metric{display:flex;justify-content:space-between;gap:10px;font-size:11px}.metric span{color:var(--muted)}
.placeholder{background:#fff;border:1px dashed #cbd5e1;border-radius:18px;padding:30px;text-align:center;color:var(--muted)}
.module-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.module-head h3{margin:0;font-size:20px}.module-head p{margin:5px 0 0;color:var(--muted);font-size:12px}
.module-tools{display:flex;gap:8px;flex-wrap:wrap}
.input,.select{border:1px solid #d1d5db;background:#fff;border-radius:10px;padding:10px 12px;min-width:170px;color:var(--text)}
.module-grid{display:grid;grid-template-columns:repeat(4,minmax(180px,1fr));gap:12px;margin-bottom:14px}
.mini-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer}
.mini-card span{display:block;color:var(--muted);font-size:11px}.mini-card b{display:block;margin-top:6px;font-size:20px}
.table-card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 8px 24px #0f172a0d}
.table-wrap{overflow:auto}.data-table{width:100%;border-collapse:collapse;min-width:900px}
.data-table th,.data-table td{padding:11px 12px;border-bottom:1px solid #eef2f7;font-size:12px;white-space:nowrap}
html[dir="rtl"] .data-table th,html[dir="rtl"] .data-table td{text-align:right}
html[dir="ltr"] .data-table th,html[dir="ltr"] .data-table td{text-align:left}
.data-table th{background:#f8fafc;color:#475569}.data-table tr:hover td{background:#fafafa}
.product-name{font-weight:900}.empty{padding:30px;text-align:center;color:var(--muted)}
.pill{display:inline-flex;align-items:center;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:900}
.pill.ok{background:#ecfdf5;color:#166534}.pill.low{background:#fff7ed;color:#9a3412}.pill.zero{background:#fef2f2;color:#991b1b}
.modal{display:none;position:fixed;inset:0;background:#0f172a7a;z-index:99;padding:28px;align-items:center;justify-content:center}
.modal.show{display:flex}.panel{background:#fff;border-radius:20px;width:min(1050px,100%);max-height:90vh;overflow:auto}
.panel-head{display:flex;justify-content:space-between;align-items:center;padding:18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:3}
.panel-body{padding:18px}.detail-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.detail{background:#f8fafc;border:1px solid var(--line);border-radius:13px;padding:13px}.detail span{display:block;color:var(--muted);font-size:11px}.detail b{display:block;margin-top:5px;font-size:18px}
.error{display:none;background:#fef2f2;color:#991b1b;border:1px solid #fecaca;border-radius:12px;padding:11px 13px;margin-bottom:14px;white-space:pre-wrap}
.loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#f5f6f8;z-index:999}
.loading div{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 24px;font-weight:900}

/* Rep reports */
.rep-shell{display:grid;grid-template-columns:270px 1fr;gap:14px;align-items:start}
html[dir="ltr"] .rep-shell{grid-template-columns:270px 1fr}
.rep-list{display:grid;gap:8px;position:sticky;top:16px}
.rep-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;transition:.15s}
.rep-card:hover,.rep-card.active{border-color:#8b5cf6;box-shadow:0 8px 22px #8b5cf61f}
.rep-card b{display:block;font-size:13px}.rep-card span{display:block;color:var(--muted);font-size:10px;margin-top:4px}
.rep-main{min-width:0}.report-filter{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.filter-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:end}
.filter-grid label{display:grid;gap:5px;font-size:11px;color:var(--muted);font-weight:800}
.report-banner{background:#ecfdf5;border:1px solid #86efac;border-radius:16px;padding:14px 16px;margin-bottom:12px}
.report-banner span{font-size:11px;color:#166534}.report-banner strong{display:block;font-size:26px;color:#166534;margin-top:5px}
.report-kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:12px}
.report-kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;transition:.15s}
.report-kpi:hover,.report-banner:hover{transform:translateY(-1px);border-color:#8b5cf6;box-shadow:0 9px 24px #8b5cf61f}
.report-banner{cursor:pointer;transition:.15s}
.report-kpi span{display:block;color:var(--muted);font-size:10px}.report-kpi b{display:block;margin-top:5px;font-size:17px}
.progress{height:8px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;background:#16a34a}
.report-section{margin-top:12px}
.report-section h4{margin:0;padding:13px 15px;background:#fff;border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0}
.report-section .table-card{border-radius:0 0 14px 14px}

.company-sales-hero{background:#ecfdf5;border:1px solid #86efac;border-radius:18px;padding:16px 18px;margin-bottom:12px;cursor:pointer;transition:.15s}
.company-sales-hero:hover{transform:translateY(-1px);box-shadow:0 10px 28px #16a34a1f}
.company-sales-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin-bottom:12px}
.company-sales-head span{font-size:11px;color:#166534;font-weight:800}.company-sales-head strong{font-size:28px;color:#166534}
.company-target-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.company-target-cell{background:#fff;border:1px solid #bbf7d0;border-radius:12px;padding:10px;cursor:pointer}
.company-target-cell:hover{border-color:#16a34a}.company-target-cell span{display:block;color:#64748b;font-size:10px}.company-target-cell b{display:block;margin-top:4px;font-size:15px}
.company-groups{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.company-group-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;cursor:pointer}
.company-group-card:hover{border-color:#8b5cf6;box-shadow:0 8px 22px #8b5cf61f}.company-group-card h5{margin:0 0 8px;font-size:13px}.company-group-card p{margin:4px 0;color:#64748b;font-size:10px}
.not-set{color:#b45309!important}
@media(max-width:1100px){.company-target-grid,.company-groups{grid-template-columns:repeat(2,1fr)}}
@media(max-width:720px){.company-target-grid,.company-groups{grid-template-columns:1fr}.company-sales-head{flex-direction:column}}

.rep-report-tile{display:flex;justify-content:space-between;align-items:center;gap:15px;background:linear-gradient(135deg,#fff,#faf5ff);border:1px solid #e9d5ff;border-radius:18px;padding:18px;margin-bottom:14px}
.rep-report-tile h3{margin:0}.rep-report-tile p{margin:5px 0 0;color:var(--muted);font-size:12px}

.regions-groups{display:grid;gap:14px}
.region-group-block{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px}
.region-group-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}
.region-group-head h3{margin:0;font-size:17px}.territory-grid{display:grid;grid-template-columns:repeat(2,minmax(260px,1fr));gap:12px}
.territory-card{border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;background:#fff}
.territory-card:hover{border-color:#8b5cf6;box-shadow:0 8px 22px #8b5cf61f}
.territory-card h4{margin:0 0 6px}.territory-card .rep-line{font-size:11px;color:#64748b;margin-bottom:10px}
.area-chips{display:flex;flex-wrap:wrap;gap:6px}.area-chip{background:#f1f5f9;border:1px solid #e2e8f0;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:800}
.territory-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}.territory-stats div{background:#f8fafc;border-radius:10px;padding:8px}.territory-stats span{display:block;color:#64748b;font-size:9px}.territory-stats b{display:block;margin-top:3px;font-size:12px}
.rep-coverage-block{margin-top:14px}.coverage-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.coverage-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}.coverage-card h4{margin:0 0 8px}
@media(max-width:1000px){.territory-grid,.coverage-grid{grid-template-columns:1fr 1fr}}
@media(max-width:720px){.territory-grid,.coverage-grid{grid-template-columns:1fr}}


.detail.clickable{cursor:pointer;transition:.15s}
.detail.clickable:hover{border-color:#8b5cf6;box-shadow:0 7px 20px #8b5cf61f;transform:translateY(-1px)}
.territory-stats div{cursor:pointer;transition:.15s}
.territory-stats div:hover{background:#eef2ff}
.area-chip.clickable{cursor:pointer}
.area-chip.clickable:hover{border-color:#8b5cf6;background:#faf5ff}
.coverage-card{cursor:pointer;transition:.15s}
.coverage-card:hover{border-color:#8b5cf6;box-shadow:0 8px 22px #8b5cf61f}
.customer-row{cursor:pointer}.customer-row:hover td{background:#faf5ff!important}


.status-chip{display:inline-flex;align-items:center;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:900;background:#f1f5f9;color:#475569}
.status-chip.requested,.status-chip.pending{background:#fff7ed;color:#9a3412}
.status-chip.prepared,.status-chip.approved{background:#eff6ff;color:#1d4ed8}
.status-chip.sold,.status-chip.dispatched,.status-chip.completed{background:#ecfdf5;color:#166534}
.status-chip.cancelled,.status-chip.rejected{background:#fef2f2;color:#991b1b}
.summary-note{font-size:11px;color:#64748b;margin-top:7px;line-height:1.6}
.click-row{cursor:pointer}.click-row:hover td{background:#faf5ff!important}
.entity-title{font-weight:900}
.kpi-strip{display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi-strip .mini-card{min-height:88px}
@media(max-width:1100px){.kpi-strip{grid-template-columns:repeat(3,1fr)}}
@media(max-width:720px){.kpi-strip{grid-template-columns:1fr}}


.report-filter-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:14px}
.report-filter-bar label{display:grid;gap:5px;font-size:10px;font-weight:900;color:#64748b}
.report-filter-bar input,.report-filter-bar select{min-width:150px}
.finance-grid{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.finance-account-card{cursor:pointer;background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;transition:.15s}
.finance-account-card:hover{border-color:#8b5cf6;box-shadow:0 8px 22px #8b5cf61f}
.finance-account-card span{display:block;color:#64748b;font-size:10px;font-weight:900}
.finance-account-card b{display:block;font-size:17px;margin-top:7px}
.balance-ok{color:#166534}.balance-bad{color:#991b1b}
.flow-positive{color:#166534;font-weight:900}.flow-negative{color:#991b1b;font-weight:900}
.period-label{font-size:11px;color:#64748b;font-weight:800}
@media(max-width:1000px){.finance-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:650px){.finance-grid{grid-template-columns:1fr}.report-filter-bar{display:grid;grid-template-columns:1fr}.report-filter-bar input,.report-filter-bar select{min-width:0;width:100%}}


.auth-card{max-width:620px;margin:18px auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 14px 34px #0f172a0d}
.auth-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.auth-grid .full{grid-column:1/-1}
.auth-note{font-size:11px;color:#64748b;line-height:1.7;margin-top:10px}
.auth-state{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.auth-pill{padding:5px 9px;border-radius:999px;background:#f1f5f9;font-size:10px;font-weight:900}
.auth-pill.ok{background:#ecfdf5;color:#166534}
.auth-pill.warn{background:#fff7ed;color:#9a3412}
.user-table td,.user-table th{vertical-align:middle}
.permission-grid{display:grid;grid-template-columns:minmax(150px,1.4fr) repeat(4,minmax(70px,.7fr));gap:1px;background:#e2e8f0;border:1px solid #e2e8f0;border-radius:12px;overflow:hidden}
.permission-grid>div{background:#fff;padding:9px;font-size:11px}
.permission-grid .head{font-weight:900;background:#f8fafc}
.permission-grid input{width:18px;height:18px}
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.settings-grid .card{padding:16px}
.system-health-grid{display:grid;grid-template-columns:repeat(3,minmax(150px,1fr));gap:10px}
@media(max-width:760px){.auth-grid,.settings-grid,.system-health-grid{grid-template-columns:1fr}.permission-grid{grid-template-columns:minmax(120px,1.3fr) repeat(4,minmax(52px,.6fr));overflow:auto}}


#secureGate{position:fixed;inset:0;z-index:100000;background:#f4f6f9;display:none;align-items:center;justify-content:center;padding:24px}
#secureGate .secure-login{width:min(520px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 24px 70px #0f172a20}
#secureGate .secure-login h2{margin:0 0 5px;font-size:24px}
#secureGate .secure-login p{margin:0 0 18px;color:#64748b;font-size:12px;line-height:1.7}
#secureGate .secure-brand{font-weight:1000;font-size:14px;color:#7c3f68;margin-bottom:14px}
body.secure-locked .app{display:none!important}
body.secure-locked #loading{display:none!important}
.permission-blocked{max-width:680px;margin:30px auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;text-align:center}

@media print{
 .side,.top,.health,.report-filter,.rep-list,.no-print{display:none!important}
 .app,.main,.rep-shell{display:block!important}.main{padding:0!important}.rep-main{width:100%!important}
 body{background:#fff}.card,.table-card,.report-kpi,.report-banner{box-shadow:none!important}
}
@media(max-width:1100px){.grid{grid-template-columns:repeat(2,1fr)}.module-grid{grid-template-columns:repeat(2,1fr)}.report-kpis{grid-template-columns:repeat(3,1fr)}.filter-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:850px){.rep-shell{grid-template-columns:1fr}.rep-list{position:static;grid-template-columns:repeat(2,1fr)}}
@media(max-width:720px){.app{display:block}.side{height:auto;position:relative}.main{padding:14px}.grid,.module-grid,.report-kpis,.filter-grid,.detail-grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.rep-list{grid-template-columns:1fr}}

/* STEP15 — CFO Cash Flow workbook layout */
.cf15-shell{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;overflow:hidden}
.cf15-toolbar{display:flex;gap:8px;align-items:end;flex-wrap:wrap;margin-bottom:12px}
.cf15-toolbar label{font-size:11px;color:#64748b;font-weight:800;display:flex;flex-direction:column;gap:5px}
.cf15-toolbar input,.cf15-toolbar select{min-width:145px}
.cf15-alert{padding:10px 12px;border:1px solid #f59e0b55;background:#fffbeb;border-radius:12px;color:#92400e;font-size:12px;line-height:1.7;margin-bottom:10px}
.cf15-ok{padding:10px 12px;border:1px solid #22c55e55;background:#f0fdf4;border-radius:12px;color:#166534;font-size:12px;line-height:1.7;margin-bottom:10px}
.cf15-sheet-wrap{overflow:auto;border:1px solid #111;background:#fff}
.cf15-sheet{border-collapse:collapse;min-width:1450px;width:100%;font-size:11px;table-layout:auto}
.cf15-sheet th,.cf15-sheet td{border:1px solid #222;padding:5px 7px;text-align:center;white-space:nowrap;height:29px}
.cf15-sheet th:first-child,.cf15-sheet td:first-child{position:sticky;left:0;z-index:4;background:#fff;text-align:start;min-width:215px;font-weight:800}
[dir="rtl"] .cf15-sheet th:first-child,[dir="rtl"] .cf15-sheet td:first-child{left:auto;right:0}
.cf15-sheet .cf15-title th{font-size:17px;font-weight:1000;text-align:center;background:#fff;position:static}
.cf15-sheet .cf15-half th{font-size:12px;font-weight:900;text-align:center;background:#fff;position:static}
.cf15-section td{font-size:13px;font-weight:1000;text-align:start;background:#f8fafc}
.cf15-income-total td:first-child{background:#7CFC00!important}
.cf15-income-total td{font-weight:1000}
.cf15-out-total td:first-child{background:#dbeafe!important}
.cf15-out-total td,.cf15-closing td{font-weight:1000}
.cf15-weekend{background:#fff98c!important}
.cf15-number{cursor:pointer}
.cf15-number:hover{box-shadow:inset 0 0 0 2px #7c3f68;background:#faf5ff}
.cf15-negative{color:#dc2626;font-weight:900}
.cf15-zero{color:#64748b}
.cf15-lower{display:grid;grid-template-columns:minmax(380px,1fr) minmax(420px,1fr);gap:18px;margin-top:18px;align-items:start}
.cf15-summary,.cf15-balances{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;overflow:auto}
.cf15-summary table,.cf15-balances table{width:100%;border-collapse:collapse;font-size:12px}
.cf15-summary th,.cf15-summary td,.cf15-balances th,.cf15-balances td{border:1px solid #222;padding:7px 9px}
.cf15-summary th,.cf15-balances th{font-weight:1000}
.cf15-balance-row{cursor:pointer}
.cf15-balance-row:hover{background:#f8fafc}
.cf15-temp{background:#fff7ed}
.cf15-native{font-size:10px;color:#64748b;display:block;margin-top:2px}
.cf15-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.cf15-detail-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.cf15-route-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cf15-route-grid .full{grid-column:1/-1}
.cf15-small{font-size:10px;color:#64748b}
@media(max-width:900px){.cf15-lower{grid-template-columns:1fr}.cf15-route-grid{grid-template-columns:1fr}}

async function getAll(view){
 let out=[],offset=0,limit=1000;
 while(true){
  const r=await fetch(`${SB_URL}/rest/v1/${encodeURIComponent(view)}?select=*&limit=${limit}&offset=${offset}`,{headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY},cache:'no-store'});
  const text=await r.text();let rows=[];
  try{rows=text?JSON.parse(text):[]}catch(e){throw new Error(view+' returned invalid JSON')}
  if(!r.ok)throw new Error(view+': '+(rows?.message||text||r.status));
  out.push(...A(rows));if(rows.length<limit)break;offset+=limit;if(offset>30000)throw new Error(view+': pagination stop');
 }
 return out;
}
async function getAllSession(view){
 if(!AUTH.accessToken)throw new Error('AUTH_REQUIRED');
 let out=[],offset=0,limit=1000;
 while(true){
  const r=await authFetch(`${SB_URL}/rest/v1/${encodeURIComponent(view)}?select=*&limit=${limit}&offset=${offset}`,{});
  const text=await r.text();let rows=[];
  try{rows=text?JSON.parse(text):[]}catch(e){throw new Error(view+' returned invalid JSON')}
  if(!r.ok)throw new Error(view+': '+(rows?.message||text||r.status));
  out.push(...A(rows));
  if(rows.length<limit)break;
  offset+=limit;
  if(offset>30000)throw new Error(view+': pagination stop');
 }
 return out;
}

/* Products */
function stockStatus(r){const qty=N(r.current_stock_qty),min=N(r.min_stock_qty??r.min_stock??r.reorder_level);if(qty<=0)return [T('out'),'zero'];if(min>0&&qty<=min)return [T('low'),'low'];return [T('available'),'ok']}
function productRows(){const text=S(($('productSearch')||{}).value).toLowerCase(),filter=S(($('stockFilter')||{}).value||'all');return A(D.inventory).filter(r=>{const hay=(S(r.product_name)+' '+S(r.product_code)+' '+S(r.lot_number)).toLowerCase();if(text&&!hay.includes(text))return false;const st=stockStatus(r)[1];if(filter==='low'&&st!=='low')return false;if(filter==='zero'&&st!=='zero')return false;if(filter==='available'&&st!=='ok')return false;return true})}
function renderProducts(){
 const rows=A(D.inventory),totalQty=rows.reduce((a,r)=>a+N(r.current_stock_qty),0),totalValue=rows.reduce((a,r)=>a+N(r.ending_inventory_value),0),low=rows.filter(r=>stockStatus(r)[1]==='low').length,zero=rows.filter(r=>stockStatus(r)[1]==='zero').length;
 $('view-products').innerHTML=`<div class="module-head"><div><h3>${T('productsTitle')}</h3><p>${T('productsSource')}</p></div><div class="module-tools"><input id="productSearch" class="input" placeholder="${T('searchProduct')}" oninput="renderProductTable()"><select id="stockFilter" class="select" onchange="renderProductTable()"><option value="all">${T('allProducts')}</option><option value="available">${T('available')}</option><option value="low">${T('low')}</option><option value="zero">${T('out')}</option></select></div></div>
 <div class="module-grid"><div class="mini-card" onclick="openInventorySummary('value')"><span>${T('inventoryValue')}</span><b>${money(totalValue)}</b></div><div class="mini-card" onclick="openInventorySummary('qty')"><span>${T('totalQty')}</span><b>${num(totalQty,2)}</b></div><div class="mini-card" onclick="setStockFilter('low')"><span>${T('low')}</span><b>${num(low,0)}</b></div><div class="mini-card" onclick="setStockFilter('zero')"><span>${T('out')}</span><b>${num(zero,0)}</b></div></div><div class="table-card"><div id="productTableWrap" class="table-wrap"></div></div>`;
 renderProductTable();
}
function renderProductTable(){
 PRODUCT_VIEW_ROWS=productRows();const w=$('productTableWrap');if(!w)return;
 if(!PRODUCT_VIEW_ROWS.length){w.innerHTML=`<div class="empty">${T('noProducts')}</div>`;return}
 w.innerHTML=`<table class="data-table"><thead><tr><th>${T('product')}</th><th>${T('code')}</th><th>${T('balance')}</th><th>${T('cost')}</th><th>${T('inventoryValue')}</th><th>${T('opening')}</th><th>${T('sold')}</th><th>${T('status')}</th></tr></thead><tbody>${PRODUCT_VIEW_ROWS.map(r=>{const st=stockStatus(r);return `<tr><td class="product-name">${esc(r.product_name||'-')}</td><td>${esc(r.product_code||r.code||'-')}</td><td>${num(r.current_stock_qty,2)}</td><td>${money(r.canonical_unit_cost||r.unit_cost||r.cost)}</td><td>${money(r.ending_inventory_value)}</td><td>${num(r.opening_qty,2)}</td><td>${num(r.sold_qty,2)}</td><td><span class="pill ${st[1]}">${st[0]}</span></td></tr>`}).join('')}</tbody></table>`;
}

function customerName(r){return S(r.name||r.customer_name||r.clinic_name||r.doctor_name||r.customer||'-')}
function customerKey(r){return S(r.id||r.customer_id)||norm(customerName(r))}
function customerArea(r){return S(r.area||r.area_name||r.region_name||r.region||r.territory_code||'-')}
function customerByKey(key){
 return A(D.customers).find(r=>customerKey(r)===key) ||
        A(D.customers).find(r=>norm(customerName(r))===norm(key));
}
function rowsForCustomer(rows,c){
 const id=S(c?.id||c?.customer_id),name=norm(customerName(c||{}));
 return A(rows).filter(r=>(id&&S(r.customer_id)===id)||norm(r.customer_name)===name||norm(r.clinic_name)===name);
}
function splitRowsForCustomer(c){
 const id=S(c?.id||c?.customer_id),name=norm(customerName(c||{}));
 return A(D.splits).filter(r=>(id&&S(r.customer_id)===id)||norm(r.customer_name||r.clinic_name)===name);
}
function customerReceivable(c){
 const id=S(c?.id||c?.customer_id),name=norm(customerName(c||{}));
 const row=A(D.agingSummary).find(r=>(id&&S(r.customer_id)===id)||norm(r.customer_name)===name);
 return row?N(row.total_outstanding):0;
}

function payloadObj(r){return (r&&r.payload&&typeof r.payload==='object'&&!Array.isArray(r.payload))?r.payload:{}}
function pv(r,...keys){
 const p=payloadObj(r);
 for(const k of keys){
   if(r && r[k]!==undefined && r[k]!==null && S(r[k])!=='') return r[k];
   if(p && p[k]!==undefined && p[k]!==null && S(p[k])!=='') return p[k];
 }
 return '';
}
function supplierName(r){return S(r?.name||r?.supplier_name||pv(r,'supplierName'))||'-'}
function supplierKey(r){return S(r?.id||r?.supplier_id)||norm(supplierName(r))}
function supplierByKey(key){
 return A(D.suppliers).find(r=>supplierKey(r)===S(key)) ||
        A(D.suppliers).find(r=>norm(supplierName(r))===norm(key));
}
function purchasesForSupplier(s){
 const id=S(s?.id||s?.supplier_id),name=norm(supplierName(s||{}));
 return A(D.purchases).filter(r=>(id&&S(r.supplier_id)===id)||norm(r.supplier_name)===name);
}
function supplierDueComputed(s){
 const rows=purchasesForSupplier(s);
 if(rows.length) return rows.reduce((a,r)=>a+N(r.remaining),0);
 return N(s?.balance);
}
function supplierPurchaseTotal(s){return purchasesForSupplier(s).reduce((a,r)=>a+N(r.total),0)}
function supplierPurchasePaid(s){return purchasesForSupplier(s).reduce((a,r)=>a+N(r.paid),0)}
function supplierProductsCount(s){
 return new Set(purchasesForSupplier(s).map(r=>S(r.product_id||r.product_name)).filter(Boolean)).size;
}
function supplierTableHtml(rows){
 if(!rows.length)return `<div class="empty">${T('noData')}</div>`;

  <tbody>${rows.map(s=>{
    const ps=purchasesForSupplier(s),total=ps.reduce((a,r)=>a+N(r.total),0),due=supplierDueComputed(s);
    return `<tr class="click-row" onclick="openSupplierByKey('${esc(supplierKey(s))}')">

      <td>${esc(s.phone||pv(s,'mobile','telephone')||'-')}</td>
      <td>${esc(s.email||'-')}</td>

      <td><button class="btn small secondary" onclick="event.stopPropagation();openSupplierByKey('${esc(supplierKey(s))}')">${T('open')}</button></td>
    </tr>`;
  }).join('')}</tbody>
 </table></div></div>`;
}

function purchaseProductOptions(selected=''){

function p17AddLine(){

}

function p17ProductChanged(id){
 const productId=S(($(`p17Product_${id}`)||{}).value);
 const lots=purchaseLotsForProduct(productId);
 const lotSel=$(`p17Lot_${id}`);
 if(lotSel){
  lotSel.innerHTML=`<option value="">${T('newLot')}</option>`+lots.map(l=>`<option value="${esc(l.id)}" data-lot-number="${esc(l.lot_number||'')}" data-expiry="${esc(S(l.expiry).slice(0,10))}">${esc(l.lot_number||l.id)} • ${num(l.qty,2)}</option>`).join('');
 }
 const p=A(D.productsMaster).find(x=>S(x.id)===productId);
 if(p&&$(`p17Cost_${id}`)&&!N($(`p17Cost_${id}`).value))$(`p17Cost_${id}`).value=N(p.purchase);
 $(`p17LotNo_${id}`).value='';
 $(`p17Expiry_${id}`).value='';
 p17Recalc();
}
function p17LotChanged(id){
 const s=$(`p17Lot_${id}`),opt=s&&s.options[s.selectedIndex];
 if(!s)return;
 if(S(s.value)){
  $(`p17LotNo_${id}`).value=S(opt?.dataset?.lotNumber);
  $(`p17Expiry_${id}`).value=S(opt?.dataset?.expiry);
 }else{
  $(`p17LotNo_${id}`).value='';
  $(`p17Expiry_${id}`).value='';
 }
}
function p17CollectLines(validate=true){
 const rows=[...document.querySelectorAll('.p17-line')];
 return rows.map(el=>{
  const id=el.dataset.lineId;
  const productId=S(($(`p17Product_${id}`)||{}).value);
  const lotId=S(($(`p17Lot_${id}`)||{}).value);
  const lotNo=S(($(`p17LotNo_${id}`)||{}).value);
  const expiry=S(($(`p17Expiry_${id}`)||{}).value);
  const qty=N(($(`p17Qty_${id}`)||{}).value);
  const cost=N(($(`p17Cost_${id}`)||{}).value);
  if(validate){
   if(!productId||qty<=0||cost<0)throw new Error(T('requiredField'));
   if(!lotId&&!lotNo)throw new Error(T('lotNumber')+' — '+T('requiredField'));
  }
  return {product_id:productId,lot_id:lotId||null,lot_number:lotNo||null,expiry:expiry||null,qty,unit_cost:cost};
 });
}
function p17Recalc(){
 let lines=[];
 try{lines=p17CollectLines(false)}catch(e){}
 const total=lines.reduce((a,x)=>a+N(x.qty)*N(x.unit_cost),0);
 const paid=N(($('p17Paid')||{}).value);
 if($('p17Total'))$('p17Total').textContent=money(total);
 if($('p17Remaining'))$('p17Remaining').textContent=money(Math.max(0,total-paid));
}

async function submitPurchaseInvoice(){
 if(!requireModulePermission('purchases','add'))return;
 try{
  const supplierId=S(($('p17Supplier')||{}).value);
  const invoiceNo=S(($('p17Invoice')||{}).value);
  const purchaseDate=S(($('p17Date')||{}).value);
  const paid=N(($('p17Paid')||{}).value);
  if(!supplierId||!invoiceNo||!purchaseDate)throw new Error(T('requiredField'));
  const lines=p17CollectLines(true);
  const total=lines.reduce((a,x)=>a+N(x.qty)*N(x.unit_cost),0);
  if(paid<0||paid>total+0.001)throw new Error(T('paidExceedsTotal'));

  const result=await rpcAuth('mahsoubak_create_purchase_invoice_atomic_v2',{
   p_request_id:newRequestId('web_purchase'),
   p_purchase_date:purchaseDate,
   p_supplier_id:supplierId,
   p_invoice_number:invoiceNo,
   p_paid:paid,
   p_lines:lines
  });

  CASHFLOW_CACHE.loaded=false;
  CASHFLOW_CACHE.dailyKey='';
  CASHFLOW_CACHE.daily=[];
  closeModal();
  await loadData(false);
  show('purchases');
  alert(`${T('purchaseSaved')}\n${T('invoiceTotal')}: ${money(result?.total??total)}\n${T('invoiceRemaining')}: ${money(result?.remaining??(total-paid))}`);
 }catch(e){alert(e.message)}
}

function invoiceStatusKey(r){
 const s=norm(r.invoice_status||r.status);
 if(s.includes('fully')||s.includes('paid')&&N(r.remaining)<=0)return 'fully';
 if(N(r.invoice_total)<=0)return 'zero';
 if(N(r.paid)>0&&N(r.remaining)>0)return 'partial';
 if(N(r.paid)<=0&&N(r.remaining)>0)return 'unpaid';
 return s||'other';
}

async function b19SaveBatch(){
 const customerId=S(($('b19Customer')||{}).value);
 const repId=S(($('b19Rep')||{}).value);
 const paid=N(($('b19Paid')||{}).value);
 const total=B19_LINES.reduce((a,x)=>a+N(x.qty)*N(x.price),0);
 if(!customerId)return alert(T('selectCustomer'));
 if(!B19_LINES.length)return alert(b19t('أضف صنفًا واحدًا على الأقل','Add at least one line'));
 if(paid<0||paid>total)return alert(b19t('المبلغ المسدد غير صحيح','Invalid paid amount'));
 try{
  const res=await rpcAuth('mahsoubak_create_sales_order_batch_v2',{
   p_request_id:newRequestId('web_batch'),
   p_order_date:S(($('b19Date')||{}).value),
   p_customer_id:customerId,
   p_rep_id:repId||null,
   p_paid:paid,
   p_order_type:'sale',

   p_lines:B19_LINES.map(x=>({
    product_id:x.product_id,
    lot_id:x.lot_id,
    qty:N(x.qty),
    price:N(x.price),
    order_type:x.order_type
   }))
  });
  const obj=Array.isArray(res)?(res[0]||{}):(res||{});
  closeModal();
  await loadData(false);
  show('sales');
  alert(
   b19t('تم إنشاء الطلب بنجاح','Order created successfully')+
   '\n'+b19t('رقم الفاتورة: ','Invoice: ')+(obj.invoice_number||'-')+
   '\n'+b19t('الإجمالي: ','Total: ')+money(obj.total)
  );
 }catch(e){alert(e.message)}
}
async function b19ReviewBatch(id,decision){
 if(!requireModulePermission('operations','edit'))return;
 const msg=decision==='approved'?b19t('اعتماد الفاتورة بكل سطورها؟','Approve the entire invoice?'):b19t('رفض الفاتورة بكل سطورها؟','Reject the entire invoice?');
 if(!confirm(msg))return;
 try{
  await rpcAuth('mahsoubak_review_sales_order_batch_v2',{
   p_batch_id:id,
   p_decision:decision,
   p_notes:null
  });
  const localBatch=b19Batches().find(x=>S(x.id)===S(id));
  if(localBatch){
    localBatch.status=decision;
    localBatch.approval_status=decision;
    localBatch.operation_status=decision==='approved'?'approved':'rejected';
    localBatch.can_review=false;
  }
  closeModal();
  await loadData(false);
  show('sales');
  alert(decision==='approved'?b19t('تم اعتماد الفاتورة','Invoice approved'):b19t('تم رفض الفاتورة','Invoice rejected'));
 }catch(e){alert(e.message)}
}

function c18SelectableCustomers(){
 const byId=new Map();

 // 1) Full customer master when readable.
 A(D.customers).forEach(c=>{
  const id=S(c.id);
  if(!id||c.active===false)return;
  byId.set(id,{
   id,
   name:customerName(c)||S(c.name)||id,
   clinic_name:S(c.clinic_name),
   source:'master'
  });
 });

 // 2) Authoritative receivable view fallback.
 A(D.receivables).forEach(r=>{
  const id=S(r.customer_id);
  if(!id)return;
  const prev=byId.get(id)||{};
  byId.set(id,{
   id,
   name:S(prev.name)||S(r.customer_name)||id,
   clinic_name:S(prev.clinic_name),
   source:prev.source||'receivables'
  });
 });

 // 3) Outstanding invoice view fallback.
 A(D.collectionOutstanding).forEach(r=>{
  const id=S(r.customer_id);
  if(!id)return;
  const prev=byId.get(id)||{};
  byId.set(id,{
   id,
   name:S(prev.name)||S(r.customer_name)||id,
   clinic_name:S(prev.clinic_name),
   source:prev.source||'outstanding'
  });
 });

 return [...byId.values()].sort((a,b)=>
  S(a.name).localeCompare(S(b.name),LANG==='ar'?'ar':'en')
 );
}

function c18CustomerChanged(){
 const customerId=S(($('c18Customer')||{}).value);
 const debt=c18CustomerDebt(customerId);
 if($('c18Debt'))$('c18Debt').textContent=T('customerCurrentDebt')+': '+money(debt);
 if($('c18DebtTotal'))$('c18DebtTotal').textContent=money(debt);
 const rows=c18InvoicesForCustomer(customerId);
 const wrap=$('c18Invoices');if(!wrap)return;
 wrap.innerHTML=rows.length?rows.map((r,i)=>`<div class="c18-invoice" data-c18-invoice="${esc(r.invoice_key)}" data-remaining="${N(r.remaining)}">
   <div><b>${esc(r.invoice_number||r.invoice_key||'-')}</b><small>${esc(r.invoice_date||'-')}</small></div>
   <div><span class="p17-note">${T('invoiceTotal')}</span><b>${money(r.invoice_total)}</b></div>
   <div><span class="p17-note">${T('paid')}</span><b>${money(r.paid)}</b></div>
   <div><span class="p17-note">${T('invoiceOutstanding')}</span><b>${money(r.remaining)}</b></div>
   <label>${T('allocateAmount')}<input class="input c18-alloc" data-key="${esc(r.invoice_key)}" data-remaining="${N(r.remaining)}" type="number" min="0" max="${N(r.remaining)}" step="0.01" value="0" oninput="c18Recalc()"></label>
  </div>`).join(''):`<div class="c18-empty">${T('noOutstandingInvoices')}</div>`;
 c18Recalc();
}
function c18AllocationInputs(){return [...document.querySelectorAll('.c18-alloc')]}
function c18Recalc(){
 const amount=Math.max(0,N(($('c18Amount')||{}).value));
 const alloc=c18AllocationInputs().reduce((a,i)=>a+Math.max(0,N(i.value)),0);
 const unapplied=amount-alloc;
 if($('c18Total'))$('c18Total').textContent=money(amount);
 if($('c18Allocated'))$('c18Allocated').textContent=money(alloc);
 if($('c18Unapplied'))$('c18Unapplied').textContent=money(unapplied);
 const box=$('c18UnappliedBox');
 if(box)box.className='c18-total '+(unapplied>=-0.009?'c18-good':'c18-warning');
}
function c18ClearAllocation(){
 c18AllocationInputs().forEach(i=>i.value='0');
 c18Recalc();
}
function c18AutoAllocate(){
 let left=Math.max(0,N(($('c18Amount')||{}).value));
 c18AllocationInputs().forEach(i=>{
  const remaining=Math.max(0,N(i.dataset.remaining));
  const take=Math.min(left,remaining);
  i.value=take>0?take.toFixed(2):'0';
  left-=take;
 });
 c18Recalc();
}
function c18BuildAllocations(){
 let total=0;
 const rows=[];
 for(const i of c18AllocationInputs()){
  const amount=Math.max(0,N(i.value));
  const remaining=Math.max(0,N(i.dataset.remaining));
  if(amount>remaining+0.009)throw new Error(T('allocationExceedsInvoice'));
  if(amount>0){
   rows.push({invoice_key:S(i.dataset.key),amount:Number(amount.toFixed(2))});
   total+=amount;
  }
 }
 return {rows,total:Number(total.toFixed(2))};
}
async function submitCollection(){
 if(C18_SAVING)return;
 if(!requireModulePermission('collections','add'))return;
 try{
  const date=S(($('c18Date')||{}).value);
  const customerId=S(($('c18Customer')||{}).value);
  const amount=N(($('c18Amount')||{}).value);
  const fundId=S(($('c18Fund')||{}).value);
  const repId=S(($('c18Rep')||{}).value);
  const notes=S(($('c18Notes')||{}).value);
  if(!date||!customerId||!fundId||amount<=0)throw new Error(T('requiredField'));
  const alloc=c18BuildAllocations();
  if(alloc.total>amount+0.009)throw new Error(T('allocationExceedsCollection'));

  C18_SAVING=true;
  if($('c18Save')){$('c18Save').disabled=true;$('c18Save').textContent=LANG==='ar'?'جاري الحفظ…':'Saving…'}

  const result=await rpcAuth('mahsoubak_post_collection_secured_v2',{
   p_request_id:newRequestId('web_collection'),
   p_collection_date:date,
   p_customer_id:customerId,
   p_amount:Number(amount.toFixed(2)),
   p_fund_id:fundId,
   p_rep_id:repId||null,
   p_notes:notes||null,
   p_allocations:alloc.rows
  });

  CASHFLOW_CACHE.loaded=false;
  CASHFLOW_CACHE.dailyKey='';
  CASHFLOW_CACHE.daily=[];
  closeModal();
  await loadData(false);
  show('collections');
  alert(`${T('collectionSaved')}\n${T('cashReceived')}: ${money(result?.cash_received??amount)}\n${T('appliedToInvoices')}: ${money(result?.applied_to_invoices??alloc.total)}\n${T('unappliedCredit')}: ${money(result?.unapplied_customer_credit??(amount-alloc.total))}`);
 }catch(e){alert(e.message)}
 finally{
  C18_SAVING=false;
  if($('c18Save')){$('c18Save').disabled=false;$('c18Save').textContent=T('saveCollection')}
 }
}

function cleanUsername(v){
 return S(v).trim().toLowerCase().replace(/[^a-z0-9._-]/g,'');
}
function usernameAlias(v){
 const u=cleanUsername(v);
 return u?u+'@mahsoubak.local':'';
}

function renderSecureGate(message=''){
 document.body.classList.add('secure-locked');
 const g=$('secureGate');if(!g)return;
 g.style.display='flex';
 g.innerHTML=`<div class="secure-login">
  <div class="secure-brand">Mahsoubak Business • ${T('secureMode')}</div>
  <h2>${T('secureLoginTitle')}</h2>
  <p>${message?esc(message):T('secureLoginSub')}</p>
  <div class="auth-grid">
   <label class="full">${T('username')}<input id="secureLoginUsername" class="input" type="text" autocomplete="username"></label>
   <label class="full">${T('password')}<input id="secureLoginPassword" class="input" type="password" autocomplete="current-password"></label>
   <button class="btn secondary full" onclick="secureGateLogin()">${T('signIn')}</button>
  </div>
 </div>`;
}
function hideSecureGate(){
 document.body.classList.remove('secure-locked');
 const g=$('secureGate');if(g)g.style.display='none';
}
async function secureGateLogin(){
 const username=cleanUsername(($('secureLoginUsername')||{}).value);
 const password=S(($('secureLoginPassword')||{}).value);
 if(!username||!password){renderSecureGate(T('enterCredentials'));return}
 try{
  await loginWithCredentials(username,password);
  if(!authLinked())throw new Error('PROFILE_NOT_LINKED');
  hideSecureGate();
  if(!APP_DATA_LOADED)await loadData();
  else{buildNav();show(currentPage);}
 }catch(e){
  renderSecureGate(T('loginFailed')+': '+e.message);
 }
}
function updateAuthButton(){
 const b=$('authBtn');if(!b)return;
 if(authLinked()){
  const u=AUTH.context.user||{};
  b.textContent='👤 '+(u.name||u.email||T('signedIn'));
 }else if(AUTH.accessToken){
  b.textContent='🔐 '+T('authUnlinked');
 }else{
  b.textContent='🔐 '+T('login');
 }
}
function saveAuthTokens(data){
 AUTH.accessToken=S(data?.access_token);
 AUTH.refreshToken=S(data?.refresh_token);
 if(AUTH.accessToken)localStorage.setItem('mb_access_token',AUTH.accessToken);else localStorage.removeItem('mb_access_token');
 if(AUTH.refreshToken)localStorage.setItem('mb_refresh_token',AUTH.refreshToken);else localStorage.removeItem('mb_refresh_token');
}
function clearAuth(){
 AUTH.accessToken='';AUTH.refreshToken='';AUTH.context=null;AUTH.users=[];AUTH.permissions=[];AUTH.audit=[];
 localStorage.removeItem('mb_access_token');localStorage.removeItem('mb_refresh_token');
 Object.keys(D).forEach(k=>delete D[k]);
 APP_DATA_LOADED=false;
 buildNav();updateAuthButton();renderSecureGate();
}
async function refreshAuthToken(){
 if(!AUTH.refreshToken)return false;
 const r=await fetch(`${SB_URL}/auth/v1/token?grant_type=refresh_token`,{
  method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},
  body:JSON.stringify({refresh_token:AUTH.refreshToken}),cache:'no-store'
 });
 if(!r.ok){clearAuth();return false}
 const data=await r.json();saveAuthTokens(data);return true;
}
async function authFetch(url,options={},retry=true){
 const headers=Object.assign({},options.headers||{},{
  apikey:SB_KEY,
  Authorization:'Bearer '+(AUTH.accessToken||SB_KEY)
 });
 const r=await fetch(url,Object.assign({},options,{headers,cache:'no-store'}));
 if(r.status===401&&retry&&AUTH.refreshToken&&await refreshAuthToken()){
  return authFetch(url,options,false);
 }
 return r;
}
async function rpcAuth(name,args={}){
 if(!AUTH.accessToken)throw new Error('AUTH_REQUIRED');
 const r=await authFetch(`${SB_URL}/rest/v1/rpc/${name}`,{
  method:'POST',
  headers:{'Content-Type':'application/json','Prefer':'return=representation'},
  body:JSON.stringify(args||{})
 });
 const text=await r.text();let data=null;
 try{data=text?JSON.parse(text):null}catch(e){data=text}
 if(!r.ok)throw new Error((data&&data.message)||S(data)||('RPC '+r.status));
 return data;
}
async function getAllAuth(view){
 let out=[],offset=0,limit=1000;
 while(true){
  const r=await authFetch(`${SB_URL}/rest/v1/${encodeURIComponent(view)}?select=*&limit=${limit}&offset=${offset}`,{});
  const text=await r.text();let rows=[];
  try{rows=text?JSON.parse(text):[]}catch(e){throw new Error(view+' invalid JSON')}
  if(!r.ok)throw new Error(view+': '+(rows?.message||text||r.status));
  out.push(...A(rows));if(rows.length<limit)break;offset+=limit;
 }
 return out;
}
async function loadAuthContext(){
 if(!AUTH.accessToken){AUTH.context=null;updateAuthButton();return null}
 try{
  let c=await rpcAuth('mahsoubak_my_context_v1',{});
  AUTH.context=(c&&typeof c==='object'&&!Array.isArray(c))?c:null;
  updateAuthButton();return AUTH.context;
 }catch(e){
  if(S(e.message).includes('AUTH_REQUIRED'))clearAuth();
  return null;
 }
}
async function claimAuthProfile(showMessage=true){
 try{
  const btn=$('claimProfileBtn');
  if(btn){btn.disabled=true;btn.textContent=T('linking')}
  await rpcAuth('mahsoubak_claim_username_profile_v2',{});
  await loadAuthContext();
  if(!authLinked())throw new Error('PROFILE_NOT_LINKED_AFTER_RPC');
  await loadSecureData();
  buildNav();renderUsersModule();renderSettingsModule();updateAuthButton();hideSecureGate();
  if(!APP_DATA_LOADED)await loadData();
  if(showMessage)alert(T('linkSuccess'));
  return true;
 }catch(e){
  if(showMessage)alert(T('linkFailed')+': '+e.message);
  console.error('Username profile claim failed:',e);
  renderUsersModule();updateAuthButton();
  return false;
 }
}
async function restoreAuth(){
 if(!AUTH.accessToken){AUTH.context=null;updateAuthButton();renderSecureGate();return false}
 let c=await loadAuthContext();
 if(c&&c.authenticated&&!c.linked){
  await claimAuthProfile(false);
 }else if(authLinked()){
  try{await loadSecureData()}catch(e){console.warn(e)}
 }
 if(authLinked()){
  buildNav();updateAuthButton();hideSecureGate();return true;
 }
 renderSecureGate();return false;
}
async function loginWithCredentials(username,password){
 const email=usernameAlias(username);
 const r=await fetch(`${SB_URL}/auth/v1/token?grant_type=password`,{
  method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},
  body:JSON.stringify({email,password}),cache:'no-store'
 });
 const text=await r.text();let data={};
 try{data=text?JSON.parse(text):{}}catch(e){}
 if(!r.ok)throw new Error(data?.msg||data?.message||text||r.status);
 saveAuthTokens(data);
 await loadAuthContext();
 if(AUTH.context&&AUTH.context.authenticated&&!AUTH.context.linked){
  const ok=await claimAuthProfile(false);
  if(!ok)throw new Error('PROFILE_LINK_FAILED');
 }
 if(!authLinked())throw new Error('PROFILE_NOT_LINKED');
 await loadSecureData();
 buildNav();
 updateAuthButton();
 return true;
}

let REPORT_RANGE={from:'',to:''};

function isoOnly(v){return S(v).slice(0,10)}
function inDateRange(v,from,to){
 const d=isoOnly(v);
 if(!d)return !from&&!to;
 return (!from||d>=from)&&(!to||d<=to);
}
function reportRange(){
 const f=$('reportFrom'),t=$('reportTo');
 return {from:f?S(f.value):REPORT_RANGE.from,to:t?S(t.value):REPORT_RANGE.to};
}
function reportPeriodLabel(r=reportRange()){
 return (r.from||'…')+' → '+(r.to||'…');
}
function filteredReportData(){
 const r=reportRange();
 return {
  range:r,
  invoices:A(D.invoices).filter(x=>inDateRange(x.invoice_date||x.sale_date||x.date,r.from,r.to)),
  purchases:A(D.purchases).filter(x=>inDateRange(x.purchase_date||x.date,r.from,r.to)),
  collections:A(D.collections).filter(x=>inDateRange(x.collection_date||x.date,r.from,r.to)),
  operations:A(D.operations).filter(x=>inDateRange(x.operation_date||x.date,r.from,r.to)),
  expenses:A(D.expenses).filter(x=>inDateRange(x.expense_date||x.date,r.from,r.to))
 };
}

let CASH_RANGE={from:'',to:''};
let CASHFLOW_CACHE={loaded:false,dailyKey:'',daily:[],loading:false};

function cfIso(d){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
function cfDefaultRange(){
 const now=new Date();
 const from=new Date(now.getFullYear(),now.getMonth(),1);
 return {from:cfIso(from),to:cfIso(now)};
}
function cfEnsureDefaultRange(){
 if(CASH_RANGE.from&&CASH_RANGE.to)return;
 CASH_RANGE=cfDefaultRange();
}
function cashRange(){
 cfEnsureDefaultRange();
 const f=$('cashFrom'),t=$('cashTo');
 return {
  from:f?S(f.value):CASH_RANGE.from,
  to:t?S(t.value):CASH_RANGE.to
 };
}
function cfDateList(from,to){
 const out=[],a=new Date(from+'T00:00:00'),b=new Date(to+'T00:00:00');
 for(let d=new Date(a);d<=b;d.setDate(d.getDate()+1))out.push(new Date(d));
 return out;
}
function cfWeekend(d){const x=d.getDay();return x===5||x===6}
function cfShortDate(d){
 return d.getDate()+'-'+d.toLocaleString('en-US',{month:'short'});
}
function cfDayName(d){
 return d.toLocaleDateString('en-US',{weekday:'short'});
}
function cfFmt(v){
 const n=N(v);if(Math.abs(n)<0.005)return '0.00';
 return n.toLocaleString('en-EG',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function cfMonthTitle(){
 const r=cashRange();
 const a=new Date(r.from+'T00:00:00'),b=new Date(r.to+'T00:00:00');
 if(a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()){
  const month=a.toLocaleDateString(LANG==='ar'?'ar-EG':'en-US',{month:'long',year:'numeric'});
  return LANG==='ar'?`${T('cashflowApprovedTitle')} ${month}`:`${T('cashflowApprovedTitle')} ${month}`;
 }
 return LANG==='ar'?`Cash Flow من ${r.from} إلى ${r.to}`:`Cash Flow ${r.from} to ${r.to}`;
}
function cfHalfTitle(){
 const r=cashRange();
 return `${r.from} → ${r.to}`;
}
async function ensureCashFlowSources(force=false){
 if(CASHFLOW_CACHE.loading)return;
 if(CASHFLOW_CACHE.loaded&&!force)return;
 CASHFLOW_CACHE.loading=true;
 try{
  const [health,detail,balances,sheetRows,funds,categories,openings]=await Promise.all([
   getAllSession('mahsoubak_app_cashflow_health_v2'),
   getAllSession('mahsoubak_app_cashflow_drilldown_v2'),
   getAllSession('mahsoubak_app_cashflow_fund_balances_v2'),
   getAllSession('mahsoubak_cashflow_sheet_rows'),
   getAllSession('mahsoubak_cashflow_funds'),
   getAllSession('mahsoubak_cashflow_categories'),
   getAllSession('mahsoubak_cashflow_opening_balances')
  ]);
  D.cashflowHealth=health;D.cashflowDetail=detail;D.cashflowBalances=balances;
  D.cashflowSheetRows=sheetRows;D.cashflowFunds=funds;D.cashflowCategories=categories;D.cashflowOpenings=openings;
  CASHFLOW_CACHE.loaded=true;
 }finally{CASHFLOW_CACHE.loading=false}
}
async function cfLoadDaily(force=false){
 const r=cashRange(),key=r.from+'|'+r.to;
 if(!force&&CASHFLOW_CACHE.dailyKey===key&&A(CASHFLOW_CACHE.daily).length)return CASHFLOW_CACHE.daily;
 if(!r.from||!r.to||r.to<r.from)throw new Error('INVALID_CASHFLOW_PERIOD');

 const all=[];
 let cursor=new Date(r.from+'T00:00:00');
 const end=new Date(r.to+'T00:00:00');

 // Backend RPC safely accepts max 31 days. For a normal unrestricted
 // period filter, split the requested range into consecutive 31-day chunks.
 while(cursor<=end){
  const chunkStart=new Date(cursor);
  const chunkEnd=new Date(cursor);
  chunkEnd.setDate(chunkEnd.getDate()+30);
  if(chunkEnd>end)chunkEnd.setTime(end.getTime());

  const rows=await rpcAuth('mahsoubak_cashflow_period_daily_v2',{
   p_from:cfIso(chunkStart),
   p_to:cfIso(chunkEnd)
  });
  all.push(...A(rows));

  cursor=new Date(chunkEnd);
  cursor.setDate(cursor.getDate()+1);
 }
 CASHFLOW_CACHE.dailyKey=key;
 CASHFLOW_CACHE.daily=all;
 return all;
}

function cfRowsForCell(date,row){

 if(row.row_kind==='FUND')rows=rows.filter(x=>S(x.fund_code)===S(row.source_code)&&x.direction==='IN');
 if(row.row_kind==='CATEGORY')rows=rows.filter(x=>S(x.category_code)===S(row.source_code)&&x.direction==='OUT');
 if(row.row_key==='TOTAL_INCOME')rows=rows.filter(x=>x.direction==='IN');
 if(row.row_key==='TOTAL_CASH_OUT')rows=rows.filter(x=>x.direction==='OUT');
 return rows;
}
function cfCellValue(date,row,dailyMap){

 if(row.row_kind==='FUND'||row.row_kind==='CATEGORY'||row.row_kind==='TOTAL')
  return rows.reduce((a,x)=>a+N(x.amount_egp),0);
 const d=dailyMap[date]||{};
 if(row.row_key==='OPENING_BALANCE')return N(d.opening_balance);
 if(row.row_key==='SURPLUS_DEFICIT')return N(d.closing_balance);
 return 0;

function cfBalancesHtml(){
 const approvedCodes=['QNB','CIB','FAB','ABK','CASH_EGP','CASH_USD','WALLET','MARYAM_YEHIA'];
 const systemCodes=['UNALLOCATED_EGP','UNALLOCATED_BANK'];
 const rows=approvedCodes.map(code=>cfBalanceByCode(code)).filter(Boolean);
 const extras=A(D.cashflowBalances).filter(x=>
   x.active!==false &&
   !approvedCodes.includes(S(x.fund_code)) &&
   !systemCodes.includes(S(x.fund_code)) &&
   Math.abs(N(x.closing_egp))>.005
 ).sort((a,b)=>N(a.display_order)-N(b.display_order));
 const unalloc=A(D.cashflowBalances).filter(x=>systemCodes.includes(S(x.fund_code))&&Math.abs(N(x.closing_egp))>.005);
 const visible=[...rows,...extras,...unalloc];
 const total=visible.reduce((a,x)=>a+N(x.closing_egp),0);
 const body=visible.map(x=>{
  const temp=systemCodes.includes(S(x.fund_code));
  const extra=extras.includes(x);
  const baseLabel=temp?T('temporaryUnallocated'):(LANG==='ar'?x.name_ar:(x.name_en||x.name_ar));

async function saveCashRouteMovement(sourceType,sourceId,direction,amountEgp){

  await rpcAuth('mahsoubak_replace_cashflow_allocations_v1',{
   p_source_type:sourceType,p_source_id:sourceId,
   p_allocations:[{fund_id:fundId,category_code:S(($('cfRouteCategory')||{}).value)||null,currency:cur,amount_native:native,fx_rate:rate,amount_egp:amountEgp}],
   p_notes:'Cash Flow STEP15 routing'

 }catch(e){alert(e.message)}
}

function cfDailyContinuity(daily){
 const rows=A(daily);
 if(!rows.length)return {ok:true,diff:0};
 let maxDiff=0;
 for(let i=0;i<rows.length;i++){
  const r=rows[i];
  const calc=N(r.opening_balance)+N(r.total_income)-N(r.total_cash_out);
  maxDiff=Math.max(maxDiff,Math.abs(calc-N(r.closing_balance)));
  if(i>0)maxDiff=Math.max(maxDiff,Math.abs(N(r.opening_balance)-N(rows[i-1].closing_balance)));
 }
 return {ok:maxDiff<=0.01,diff:maxDiff};
}

 const fundOk=Math.abs(fundTotal-N(h.canonical_balance))<=0.01;
 const allOk=treasuryOk&&routingOk&&cont.ok&&fundOk;
 const box=(title,ok,detail)=>`<div class="cf16-check ${ok?'cf16-pass':'cf16-warn'}"><b>${esc(title)} — ${ok?T('checkPassed'):T('checkWarning')}</b><span>${detail}</span></div>`;

  ${box(T('treasuryMatchCheck'),treasuryOk,`Difference: ${money(N(h.movement_difference))}`)}
  ${box(T('routingCheck'),routingOk,`${num(h.unallocated_rows,0)} / ${money(h.unallocated_amount)}`)}
  ${box(T('continuityCheck'),cont.ok,`Max diff: ${cfFmt(cont.diff)}`)}
  ${box(T('fundTotalCheck'),fundOk,`${money(fundTotal)} / ${money(h.canonical_balance)}`)}

/* Rep Reports */
const GROUPS=[
 {id:'all',labelKey:'allReps',sourceGroups:[]},
 {id:'West Total',labelKey:'west',sourceGroups:['West Total']},
 {id:'East Total',labelKey:'east',sourceGroups:['East Total']},
 {id:'Delta Total',labelKey:'delta',sourceGroups:['Delta','Delta Total']},
 {id:'Alexandria Total',labelKey:'alex',sourceGroups:['Alexandria','Alexandria Total','Alex Total']}
];
function repNameById(id){const r=A(D.repMaster).find(x=>S(x.id)===S(id));return r?S(r.name||r.rep_name):S(id)}
function reportRefs(){
 return [...GROUPS,...A(D.repMaster).filter(r=>r.active!==false).map(r=>({id:S(r.id),name:S(r.name||r.rep_name)}))];
}
function refLabel(ref){
 const g=GROUPS.find(x=>x.id===ref);if(g)return T(g.labelKey);
 return repNameById(ref);
}
function dateInRange(v,from,to){const d=S(v).slice(0,10);if(from&&d<from)return false;if(to&&d>to)return false;return true}
function allocationRowsForRef(ref,from='',to=''){
 let rows=A(D.allocations).filter(r=>dateInRange(r.sale_date||r.date,from,to));
 if(ref==='all')return rows;
 const g=GROUPS.find(x=>x.id===ref);
 if(g)return rows.filter(r=>g.sourceGroups.includes(S(r.territory_group)));
 const name=norm(repNameById(ref));
 return rows.filter(r=>S(r.rep_id)===S(ref)||norm(r.rep_name)===name);
}
function canonicalGroupFromTerritory(v){
 const x=norm(v).replace(/\s/g,'');
 if(x.includes('west1')||x.includes('west2')||x==='westtotal')return 'West Total';
 if(x.includes('east1')||x.includes('east2')||x.includes('heliopolis')||x.includes('مصرالجديده')||x==='easttotal')return 'East Total';
 if(x.includes('delta')||x.includes('دلتا'))return 'Delta Total';
 if(x.includes('alex')||x.includes('اسكندري')||x.includes('الاسكندري'))return 'Alexandria Total';
 return '';
}
function repCurrentGroup(rep){
 return canonicalGroupFromTerritory(rep.territory_group||rep.territory_code||rep.region_code||rep.region_name||rep.area||'');
}
function repsForRef(ref,rows){
 if(ref==='all')return A(D.repMaster).filter(r=>r.active!==false);
 if(GROUPS.some(g=>g.id===ref)){
   const current=A(D.repMaster).filter(r=>r.active!==false&&repCurrentGroup(r)===ref);
   if(current.length)return current;
   const names=new Set(rows.map(r=>norm(r.rep_name)).filter(Boolean));
   return A(D.repMaster).filter(r=>names.has(norm(r.name||r.rep_name)));
 }
 return A(D.repMaster).filter(r=>S(r.id)===S(ref));
}
function collectionRowsForRef(ref,from='',to=''){
 let rows=A(D.collections).filter(r=>dateInRange(r.collection_date||r.date,from,to));
 if(ref==='all')return rows;
 const alloc=allocationRowsForRef(ref,from,to),ids=new Set(alloc.map(r=>S(r.rep_id)).filter(Boolean)),names=new Set(alloc.map(r=>norm(r.rep_name)).filter(Boolean));
 return rows.filter(r=>(S(r.rep_id)&&ids.has(S(r.rep_id)))||(norm(r.rep_name)&&names.has(norm(r.rep_name))));
}
function groupInvoices(rows){
 const m=new Map();
 rows.forEach(r=>{
  const k=S(r.invoice_key||r.invoice_number||r.invoice_no||r.order_id||r.sale_id)||S(r.sale_id);
  if(!m.has(k))m.set(k,{key:k,date:S(r.sale_date||r.date).slice(0,10),customer:S(r.customer_name),region:S(r.territory_code),qty:0,sales:0,remaining:0,products:new Set()});
  const x=m.get(k);x.qty+=N(r.allocated_qty);x.sales+=N(r.allocated_total);x.remaining+=N(r.allocated_remaining);if(r.product_name)x.products.add(S(r.product_name));
 });
 return [...m.values()];
}
function customerSummary(rows){
 const m=new Map();
 rows.forEach(r=>{const k=S(r.customer_id)||norm(r.customer_name);if(!m.has(k))m.set(k,{name:S(r.customer_name),sales:0,remaining:0,qty:0,invoices:new Set()});const x=m.get(k);x.sales+=N(r.allocated_total);x.remaining+=N(r.allocated_remaining);x.qty+=N(r.allocated_qty);x.invoices.add(S(r.invoice_key||r.invoice_number||r.sale_id))});
 return [...m.values()].sort((a,b)=>b.sales-a.sales);
}
function regionSummary(rows){
 const m=new Map();
 rows.forEach(r=>{const k=S(r.territory_code||'Unspecified');if(!m.has(k))m.set(k,{name:k,sales:0,remaining:0,qty:0,invoices:new Set()});const x=m.get(k);x.sales+=N(r.allocated_total);x.remaining+=N(r.allocated_remaining);x.qty+=N(r.allocated_qty);x.invoices.add(S(r.invoice_key||r.invoice_number||r.sale_id))});
 return [...m.values()].sort((a,b)=>b.sales-a.sales);
}
function reportTarget(ref,rows){
 return repsForRef(ref,rows).reduce((a,r)=>a+repTargetValue(r),0);
}
function reportAchieved(rows){return rows.filter(isTargetQtyRow).reduce((a,r)=>a+N(r.allocated_qty),0)}

function moneyTargetRow(scopeType,scopeKey){

}

function moneyTargetForRef(ref){

function companyGroupStats(group,from='',to=''){

function validate(){
 const s=summary(),rh=runtimeHealth(),ch=collectionHealth(),
       a=A(D.allocations),
       as=a.reduce((x,r)=>x+N(r.allocated_total),0),
       ar=a.reduce((x,r)=>x+N(r.allocated_remaining),0),
       rs=A(D.repSales).reduce((x,r)=>x+N(r.sales),0),
       p=A(D.purchases),
       pt=p.reduce((x,r)=>x+N(r.total),0),
       pp=p.reduce((x,r)=>x+N(r.paid),0),
       pr=p.reduce((x,r)=>x+N(r.remaining),0),
       c=A(D.collections),
       cc=c.reduce((x,r)=>x+N(r.cash_received),0),
       ca=c.reduce((x,r)=>x+N(r.applied_to_invoices),0),
       cu=c.reduce((x,r)=>x+N(r.unapplied_customer_credit),0);

 const salesOk=
   Math.abs(as-N(s.company_sales))<=.01 &&
   Math.abs(ar-N(s.receivables_from_sales||s.invoice_remaining))<=.01 &&
   Math.abs(rs-N(s.company_sales))<=.01;

 const purchaseOk=
   Math.abs(pt-N(rh.purchase_total))<=.01 &&
   Math.abs(pp-N(rh.purchase_paid))<=.01 &&
   Math.abs(pr-N(rh.purchase_remaining))<=.01 &&
   Number(p.length)===Number(rh.purchase_rows);

 const collectionOk=
   S(ch.status)==='PHASE6G4A_COLLECTION_CUTOVER_READY' &&
   S(ch.runtime_status)==='RUNTIME_CONTRACT_V2_MATCH' &&
   S(ch.cashflow_status)==='CASHFLOW_V2_READY' &&
   Math.abs(cc-N(ch.collection_cash))<=.01 &&
   Math.abs(ca-N(ch.collection_applied))<=.01 &&
   Math.abs(cu-N(ch.collection_unapplied))<=.01 &&
   Number(c.length)===Number(ch.collection_rows) &&
   Math.abs(cc-N(s.collection_cash))<=.01 &&
   Math.abs(ca-N(s.collection_applied))<=.01 &&
   Math.abs(cu-N(s.collection_unapplied))<=.01 &&
   Math.abs(N(ch.cashflow_difference))<=.01 &&
   N(ch.unallocated_rows)===0;

 const runtimeOk=
   S(rh.status)==='PHASE6G3C_PURCHASE_CUTOVER_READY' &&
   S(rh.runtime_status)==='RUNTIME_CONTRACT_V2_MATCH' &&
   S(rh.cashflow_status)==='CASHFLOW_V2_READY' &&
   Math.abs(N(rh.runtime_ledger_difference))<=.01 &&
   Math.abs(N(rh.balance_sheet_difference))<=.01 &&
   Math.abs(N(rh.treasury_difference))<=.01 &&
   Math.abs(N(rh.cashflow_difference))<=.01 &&
   N(rh.inventory_problem_rows)===0 &&
   N(rh.supplier_balance_problem_rows)===0 &&
   N(rh.unallocated_rows)===0;

 const ok=salesOk&&purchaseOk&&collectionOk&&runtimeOk;

 $('healthDot').className='dot '+(ok?'ok':'bad');
 $('healthText').textContent=ok
   ? `Runtime Contract MATCH • Sales ${money(s.company_sales)} • Purchases ${money(pt)} • Collections ${money(cc)} • Treasury ${money(s.treasury_balance)}`
   : T('runtimeContractCheck');

 return ok;
}

function canonicalSupplierDue(){return A(D.suppliers).reduce((a,x)=>a+Math.max(0,supplierDueComputed(x)),0)}
function liquidityCanonicalData(){
 const s=summary();
 const available=N(s.treasury_balance);
 const expected=N(s.receivables_from_sales||s.invoice_remaining);
 const supplierDue=canonicalSupplierDue();
 const resources=available+expected;
 const obligations=supplierDue;
 const net=resources-obligations;
 const coverage=obligations>0?(resources/obligations*100):100;
 return {available,expected,supplierDue,resources,obligations,net,coverage};
}

function financeStatementData(){
 const s=summary();
 const revenue=N(s.company_sales),cogs=N(s.cogs),expenses=N(s.expense_total),net=N(s.current_period_net_income);
 const assets=N(s.total_assets),diff=N(s.balance_sheet_difference);
 const trial=A(D.trial);
 const normType=v=>norm(v);
 const signed=(r)=>N(r.balance);
 const liabilities=trial.filter(r=>normType(r.account_type).includes('liab')).reduce((a,r)=>a+Math.abs(signed(r)),0);
 const equity=trial.filter(r=>normType(r.account_type).includes('equity')).reduce((a,r)=>a+Math.abs(signed(r)),0);
 return {revenue,cogs,expenses,net,assets,liabilities,equity,diff};
}

liquidityCanonicalData=function(){
 const s=summary(),available=N(s.treasury_balance),customerReceivable=N(s.receivables_from_sales||s.invoice_remaining),supplierDue=canonicalSupplierDue();
 const openPapers=A(D.receivablePapers).filter(r=>!['COLLECTED','CANCELLED','RETURNED'].includes(S(r.status).toUpperCase()));
 const openReceivableCheques=A(D.cheques).filter(r=>S(r.cheque_type).toUpperCase()==='RECEIVABLE'&&!['COLLECTED','CANCELLED','RETURNED'].includes(S(r.status).toUpperCase()));
 const openPayableCheques=A(D.cheques).filter(r=>S(r.cheque_type).toUpperCase()==='PAYABLE'&&!['PAID','CANCELLED','RETURNED'].includes(S(r.status).toUpperCase()));
 const papers=openPapers.reduce((a,r)=>a+N(r.amount_egp||r.amount),0),recvCheques=openReceivableCheques.reduce((a,r)=>a+N(r.amount_egp||r.amount),0),payCheques=openPayableCheques.reduce((a,r)=>a+N(r.amount_egp||r.amount),0);
 const expected=customerReceivable+papers+recvCheques,obligations=supplierDue+payCheques,resources=available+expected,net=resources-obligations,coverage=obligations>0?(resources/obligations*100):100;
 const now=new Date(p24Today()+'T00:00:00'),d7=new Date(now);d7.setDate(d7.getDate()+7);const d30=new Date(now);d30.setDate(d30.getDate()+30);const d60=new Date(now);d60.setDate(d60.getDate()+60);
 const dueAmt=(max)=>openPayableCheques.filter(r=>r.due_date&&new Date(p24Date(r.due_date)+'T00:00:00')>=now&&new Date(p24Date(r.due_date)+'T00:00:00')<=max).reduce((a,r)=>a+N(r.amount_egp||r.amount),0);
 return {available,customerReceivable,papers,recvCheques,expected,supplierDue,payCheques,resources,obligations,net,coverage,d7:dueAmt(d7),d30:dueAmt(d30),d60:dueAmt(d60)};
};

/* BUILD13 — Liquidity due-window drilldown.
   Heavy detail view is lazy-loaded only when a due card is opened. */
async function loadLiquidityDetailLazy(){
  if(A(D.liquidityDetail).length)return A(D.liquidityDetail);
  const rows=await getAllSessionSafe(V.liquidityDetail);
  D.liquidityDetail=rows;
  return A(rows);
}
function liquidityBucketAllowed(bucket,days){
  const b=S(bucket).toUpperCase().replace(/[^A-Z0-9]+/g,'_');
  const b07=['0_7','DUE_0_7','0_TO_7','DUE_WITHIN_7'];
  const b830=['8_30','DUE_8_30','8_TO_30'];
  const b3160=['31_60','DUE_31_60','31_TO_60'];
  if(days===7)return b07.includes(b);
  if(days===30)return b07.includes(b)||b830.includes(b);
  return b07.includes(b)||b830.includes(b)||b3160.includes(b);
}
async function openLiquidityDueWindow(days){
  const title=LANG==='ar'?`الالتزامات خلال ${days} يوم`:`Obligations due within ${days} days`;
  openModal(title,`<div class="empty">${LANG==='ar'?'جاري تحميل التفاصيل من قاعدة البيانات…':'Loading details from database…'}</div>`);
  try{
    const rows=await loadLiquidityDetailLazy();
    const dueRows=rows.filter(r=>{
      const dir=S(r.direction).toUpperCase();
      const isOut=dir==='OUT'||dir==='PAYABLE'||dir==='OUTFLOW'||dir==='PAYMENT'||dir==='EXPENSE';
      return isOut && liquidityBucketAllowed(r.due_bucket,days);
    });
    const total=dueRows.reduce((a,r)=>a+N(r.amount_egp),0);
    const expected=days===7?liquidityCanonicalData().d7:days===30?liquidityCanonicalData().d30:liquidityCanonicalData().d60;
    const body=`<div class="detail-grid">${detail(LANG==='ar'?'عدد الالتزامات':'Obligations',num(dueRows.length,0))}${detail(LANG==='ar'?'إجمالي التفاصيل':'Detail total',money(total))}${detail(LANG==='ar'?'إجمالي الكارت':'Card total',money(expected))}</div><div style="height:12px"></div>${dueRows.length?table([[LANG==='ar'?'النوع':'Type',r=>esc(r.detail_type||'-')],[LANG==='ar'?'المستند':'Document',r=>esc(r.source_number||r.source_id||'-')],[LANG==='ar'?'الطرف':'Party',r=>esc(r.party_name||'-')],[LANG==='ar'?'تاريخ الاستحقاق':'Due date',r=>esc(r.due_date||'-')],[LANG==='ar'?'المبلغ':'Amount',r=>money(r.amount_egp)],[LANG==='ar'?'الفترة':'Bucket',r=>esc(r.due_bucket||'-')],[LANG==='ar'?'الحالة':'Status',r=>esc(r.status||'-')]],dueRows):`<div class="empty">${LANG==='ar'?'لا توجد التزامات مستحقة في هذه الفترة.':'No obligations are due in this period.'}</div>`}`;
    $('modalBody').innerHTML=body;
  }catch(e){
    console.error('Liquidity drilldown:',e);
    $('modalBody').innerHTML=`<div class="error" style="display:block">${LANG==='ar'?'تعذر تحميل تفاصيل السيولة الآن: ':'Could not load liquidity details: '}${esc(e.message||e)}</div>`;
  }
}

<script id="build07-fix1-lazy-finance">
(function(){
  let financeRuntimeLoading=null;
  window.ensureFinanceRuntimeLoaded=async function(){
    if((Array.isArray(D.trial)&&D.trial.length)||(Array.isArray(D.ledger)&&D.ledger.length))return true;
    if(financeRuntimeLoading)return financeRuntimeLoading;
    financeRuntimeLoading=(async function(){
      try{
        const results=await Promise.allSettled([
          getAllSession(V.trial),
          getAllSession(V.ledger)
        ]);
        D.trial=results[0].status==='fulfilled'?results[0].value:[];
        D.ledger=results[1].status==='fulfilled'?results[1].value:[];
        if(results[0].status==='rejected')console.warn('Trial balance lazy load failed:',results[0].reason);
        if(results[1].status==='rejected')console.warn('Ledger lazy load failed:',results[1].reason);
        return D.trial.length>0||D.ledger.length>0;
      }finally{financeRuntimeLoading=null;}
    })();
    return financeRuntimeLoading;
  };

  const baseShow=window.show;
  window.show=async function(id){
    if(id==='trial'||id==='finance'){
      await ensureFinanceRuntimeLoaded();
    }
    return baseShow.apply(this,arguments);
  };
  try{show=window.show}catch(e){}
})();
</script>

<script id="build14-all-cards-clickable">

/* BUILD14 — every KPI/card in the parity + liquidity sections opens its underlying detail.
   Display values remain sourced from canonical Supabase views already used by each section. */

function openLiquidityComponent(kind){
  if(kind==='cash'){
    show('cashflow');
    return;
  }

  if(kind==='customer_receivables'){
    const rows=A(D.agingSummary).filter(r=>N(r.total_outstanding)>0)
      .slice().sort((a,b)=>N(b.total_outstanding)-N(a.total_outstanding));
    openModal(
      LANG==='ar'?'مديونيات العملاء':'Customer receivables',
      table([
        [T('customer'),r=>esc(r.customer_name||'-')],
        [T('invoiceCount'),r=>num(r.open_invoice_count,0)],
        [T('remaining'),r=>money(r.total_outstanding)],
        [LANG==='ar'?'0–30 يوم':'0–30 days',r=>money(r.bucket_0_30)],
        [LANG==='ar'?'31–60 يوم':'31–60 days',r=>money(r.bucket_31_60)],
        [LANG==='ar'?'61–90 يوم':'61–90 days',r=>money(r.bucket_61_90)],
        [LANG==='ar'?'90+ يوم':'90+ days',r=>money(r.bucket_90_plus)]
      ],rows)
    );
    return;
  }

  if(kind==='receivable_papers'){
    const rows=A(D.receivablePapers).filter(r=>!['COLLECTED','CANCELLED','RETURNED'].includes(S(r.status).toUpperCase()));
    openModal(
      LANG==='ar'?'أوراق القبض المفتوحة':'Open receivable papers',
      rows.length?table([
        [LANG==='ar'?'رقم الورقة':'Paper no.',r=>esc(r.paper_number||r.id||'-')],
        [LANG==='ar'?'الطرف':'Party',r=>esc(r.customer_name||r.party_name||'-')],
        [LANG==='ar'?'الاستحقاق':'Due date',r=>esc(r.due_date||'-')],
        [LANG==='ar'?'العملة':'Currency',r=>esc(r.currency||'EGP')],
        [LANG==='ar'?'المبلغ الأصلي':'Original amount',r=>num(r.amount,2)],
        [LANG==='ar'?'المعادل بالجنيه':'EGP value',r=>money(r.amount_egp||r.amount)],
        [LANG==='ar'?'الحالة':'Status',r=>esc(r.status||'-')]
      ],rows):`<div class="empty">${LANG==='ar'?'لا توجد أوراق قبض مفتوحة.':'No open receivable papers.'}</div>`
    );
    return;
  }

  if(kind==='receivable_cheques' || kind==='payable_cheques'){
    const type=kind==='receivable_cheques'?'RECEIVABLE':'PAYABLE';
    const closed=type==='RECEIVABLE'?['COLLECTED','CANCELLED','RETURNED']:['PAID','CANCELLED','RETURNED'];
    const rows=A(D.cheques).filter(r=>S(r.cheque_type).toUpperCase()===type&&!closed.includes(S(r.status).toUpperCase()))
      .slice().sort((a,b)=>S(a.due_date).localeCompare(S(b.due_date)));
    openModal(
      type==='RECEIVABLE'?(LANG==='ar'?'شيكات القبض المفتوحة':'Open receivable cheques'):(LANG==='ar'?'شيكات الدفع المفتوحة':'Open payable cheques'),
      rows.length?table([
        [LANG==='ar'?'رقم الشيك':'Cheque no.',r=>esc(r.cheque_number||r.id||'-')],
        [LANG==='ar'?'البنك':'Bank',r=>esc(r.bank_name||'-')],
        [LANG==='ar'?'الطرف':'Party',r=>esc(r.party_name||r.customer_name||r.supplier_name||'-')],
        [LANG==='ar'?'الاستحقاق':'Due date',r=>esc(r.due_date||'-')],
        [LANG==='ar'?'العملة':'Currency',r=>esc(r.currency||'EGP')],
        [LANG==='ar'?'سعر الصرف':'FX rate',r=>num(r.fx_rate,6)],
        [LANG==='ar'?'المعادل بالجنيه':'EGP value',r=>money(r.amount_egp||r.amount)],
        [LANG==='ar'?'الحالة':'Status',r=>esc(r.status||'-')]
      ],rows):`<div class="empty">${LANG==='ar'?'لا توجد شيكات مفتوحة من هذا النوع.':'No open cheques of this type.'}</div>`
    );
    return;
  }

  if(kind==='supplier_payables'){
    const rows=A(D.suppliers).filter(r=>supplierDueComputed(r)>0);
    openModal(T('supplierDueTotal'),supplierTableHtml(rows));
    return;
  }

  if(kind==='expected_collections'){
    show('collections_dashboard');
    return;
  }

  if(kind==='obligations'){
    const x=liquidityCanonicalData();
    openModal(
      LANG==='ar'?'تفاصيل الالتزامات الحالية':'Current obligations breakdown',
      `<div class="detail-grid">
        ${detailClick(LANG==='ar'?'مستحقات الموردين':'Supplier payables',money(x.supplierDue),"openLiquidityComponent('supplier_payables')")}
        ${detailClick(LANG==='ar'?'شيكات دفع':'Payable cheques',money(x.payCheques),"openLiquidityComponent('payable_cheques')")}
        ${detail(LANG==='ar'?'الإجمالي':'Total',money(x.obligations))}
      </div>`
    );
    return;
  }

  if(kind==='net_coverage'){
    const x=liquidityCanonicalData();
    openModal(
      LANG==='ar'?'تفاصيل صافي التغطية':'Net coverage details',
      `<div class="detail-grid">
        ${detailClick(LANG==='ar'?'السيولة المتاحة':'Available liquidity',money(x.available),"openLiquidityComponent('cash')")}
        ${detailClick(LANG==='ar'?'مديونيات العملاء':'Customer receivables',money(x.customerReceivable),"openLiquidityComponent('customer_receivables')")}
        ${detailClick(LANG==='ar'?'أوراق القبض':'Receivable papers',money(x.papers),"openLiquidityComponent('receivable_papers')")}
        ${detailClick(LANG==='ar'?'شيكات قبض':'Receivable cheques',money(x.recvCheques),"openLiquidityComponent('receivable_cheques')")}
        ${detailClick(LANG==='ar'?'مستحقات الموردين':'Supplier payables',money(x.supplierDue),"openLiquidityComponent('supplier_payables')")}
        ${detailClick(LANG==='ar'?'شيكات دفع':'Payable cheques',money(x.payCheques),"openLiquidityComponent('payable_cheques')")}
        ${detail(LANG==='ar'?'صافي التغطية':'Net coverage',money(x.net))}
      </div>`
    );
  }
}

  openModal(
    (LANG==='ar'?'أعمار الديون ':'Debt aging ')+(labels[bucket]||bucket),

function cashForecastRowsBuild14(){
  return [
    ...p24OpenReceivablePapers().map(r=>({kind:'PAPER',due_date:r.due_date,amount:N(r.amount_egp||r.amount),number:r.paper_number||r.id,party:r.customer_name||r.party_name||'-'})),
    ...p24OpenReceivableCheques().map(r=>({kind:'CHEQUE',due_date:r.due_date,amount:N(r.amount_egp||r.amount),number:r.cheque_number||r.id,party:r.customer_name||r.party_name||'-'}))
  ].filter(r=>r.due_date);
}
function openCashForecastWindow(days){
  const now=new Date(p24Today()+'T00:00:00');
  const max=days?new Date(now):null;
  if(max)max.setDate(max.getDate()+days);
  const rows=cashForecastRowsBuild14().filter(r=>{
    const d=new Date(p24Date(r.due_date)+'T00:00:00');
    return d>=now&&(!max||d<=max);
  }).sort((a,b)=>S(a.due_date).localeCompare(S(b.due_date)));
  openModal(
    days?(LANG==='ar'?`التدفقات المتوقعة خلال ${days} يوم`:`Expected inflows within ${days} days`):(LANG==='ar'?'كل التدفقات المتوقعة':'All expected inflows'),
    rows.length?table([
      [LANG==='ar'?'النوع':'Type',r=>esc(r.kind)],
      [LANG==='ar'?'الرقم':'Number',r=>esc(r.number)],
      [LANG==='ar'?'الطرف':'Party',r=>esc(r.party)],
      [LANG==='ar'?'الاستحقاق':'Due date',r=>esc(p24Date(r.due_date))],
      [T('amount'),r=>money(r.amount)]
    ],rows):`<div class="empty">${LANG==='ar'?'لا توجد تدفقات متوقعة في هذه الفترة.':'No expected inflows in this period.'}</div>`
  );
}
window.openCashForecastWindow=openCashForecastWindow;

renderCashForecastP24=function(){
 const el=$('view-cash_forecast');if(!el)return;

/* Informational mini-cards in Users/Settings now open their source/status explanation instead of being dead. */
function openSystemStatusCard(kind){
 const h=A(D.health)[0]||{}, u=AUTH.user||{}, rh=A(D.purchaseHealth)[0]||{};
 if(kind==='auth'){
   openModal(T('authHealth'),`<div class="detail-grid">${detail(T('authStatus'),AUTH.accessToken?T('signedIn'):T('notSignedIn'))}${detail(T('profileHealth'),authLinked()?T('linked'):T('pendingLink'))}</div>`);
   return;
 }
 if(kind==='profile'){
   openModal(T('profileHealth'),`<div class="detail-grid">${detail(T('signedIn'),esc(u.email||AUTH.profile?.username||'-'))}${detail(T('role'),esc(AUTH.profile?.role||'-'))}</div>`);
   return;
 }
 openModal(T('coreHealth'),`<div class="detail-grid">${detail(T('coreHealth'),esc(rh.runtime_status||rh.status||h.phase6f6_status||h.status||'-'))}${detail(LANG==='ar'?'مصدر البيانات':'Data source','Supabase')}</div>`);

const _renderUsersBuild14=renderUsersModule;
renderUsersModule=function(){
  _renderUsersBuild14();
  const el=$('view-users'); if(!el)return;
  const cards=[...el.querySelectorAll('.mini-card')];
  cards.forEach(c=>{
    if(c.hasAttribute('onclick'))return;
    const text=S(c.textContent);
    if(text.includes(T('authStatus'))){c.dataset.clickable='1';c.onclick=()=>openSystemStatusCard('auth');}
    else if(text.includes(T('profileHealth'))){c.dataset.clickable='1';c.onclick=()=>openSystemStatusCard('profile');}
  });
};

const _renderSettingsBuild14=renderSettingsModule;
renderSettingsModule=function(){
  _renderSettingsBuild14();
  const el=$('view-settings'); if(!el)return;
  [...el.querySelectorAll('.mini-card')].forEach(c=>{
    if(c.hasAttribute('onclick'))return;
    c.dataset.clickable='1';
    const text=S(c.textContent);
    if(text.includes(T('authHealth')))c.onclick=()=>openSystemStatusCard('auth');
    else if(text.includes(T('profileHealth')))c.onclick=()=>openSystemStatusCard('profile');
    else c.onclick=()=>openSystemStatusCard('core');
  });
};
