async function getAll(view){let out=[],offset=0,limit=1000;while(true){const r=await fetch(`${SB_URL}/rest/v1/${encodeURIComponent(view)}?select=*&limit=${limit}&offset=${offset}`,{headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY},cache:'no-store'});const text=await r.text();let rows=[];try{rows=text?JSON.parse(text):[]}catch(e){throw new Error(view+' returned invalid JSON')}if(!r.ok)throw new Error(view+': '+(rows?.message||text||r.status));out.push(...A(rows));if(rows.length<limit)break;offset+=limit;if(offset>30000)throw new Error(view+': pagination stop')}return out}

<div class="module-grid"><div class="mini-card" onclick="setStockFilter('all')"><span>${T('inventoryValue')}</span><b>${money(totalValue)}</b></div><div class="mini-card" onclick="setStockFilter('all')"><span>${T('totalQty')}</span><b>${num(totalQty,2)}</b></div><div class="mini-card" onclick="setStockFilter('low')"><span>${T('low')}</span><b>${num(low,0)}</b></div><div class="mini-card" onclick="setStockFilter('zero')"><span>${T('out')}</span><b>${num(zero,0)}</b></div></div><div class="table-card"><div id="productTableWrap" class="table-wrap"></div></div>`;renderProductTable()}
function setStockFilter(v){if($('stockFilter'))$('stockFilter').value=v;renderProductTable()}
function renderProductTable(){PRODUCT_VIEW_ROWS=productRows();const wrap=$('productTableWrap');if(!wrap)return;if(!PRODUCT_VIEW_ROWS.length){wrap.innerHTML='<div class="empty">'+T('noProducts')+'</div>';return}wrap.innerHTML=`<table class="data-table"><thead><tr><th>${T('product')}</th><th>${T('code')}</th><th>${T('balance')}</th><th>${T('cost')}</th><th>${T('inventoryValue')}</th><th>${T('opening')}</th><th>${T('sold')}</th><th>${T('status')}</th><th>${T('details')}</th></tr></thead><tbody>${PRODUCT_VIEW_ROWS.map((r,i)=>{const st=stockStatus(r);return `<tr><td class="product-name">${S(r.product_name)||'-'}</td><td>${S(r.product_code||r.code)||'-'}</td><td>${num(r.current_stock_qty,2)}</td><td>${money(r.canonical_unit_cost||r.unit_cost||r.cost)}</td><td>${money(r.ending_inventory_value)}</td><td>${num(r.opening_qty,2)}</td><td>${num(r.sold_qty,2)}</td><td><span class="pill ${st[1]}">${st[0]}</span></td><td><button class="btn secondary" onclick="openProductByIndex(${i})">${T('open')}</button></td></tr>`}).join('')}</tbody></table>`}
function openProductByIndex(i){const r=PRODUCT_VIEW_ROWS[i]||{},st=stockStatus(r);$('modalTitle').textContent=T('details')+' — '+(S(r.product_name)||'-');$('modalBody').innerHTML=`<div class="detail-grid">${detail(T('balance'),num(r.current_stock_qty,2))}${detail(T('unitCost'),money(r.canonical_unit_cost||r.unit_cost||r.cost))}${detail(T('inventoryValue'),money(r.ending_inventory_value))}${detail('COGS',money(r.cogs||r.cogs_value))}${detail(T('openingQty'),num(r.opening_qty,2))}${detail(T('incoming'),num(r.purchased_qty??r.received_qty,2))}${detail(T('sold'),num(r.sold_qty,2))}${detail(T('status'),'<span class="pill '+st[1]+'">'+st[0]+'</span>')}</div><div class="table-card" style="margin-top:14px"><div style="padding:14px;line-height:1.9;font-size:12px"><b>${T('sourceData')}</b><br>Product ID: ${S(r.product_id||r.id)||'-'}<br>Code: ${S(r.product_code||r.code)||'-'}<br>Lot: ${S(r.lot_number)||'-'}<br>Status: ${S(r.status)||'-'}</div></div>`;$('modal').classList.add('show')}
function validate(){const s=summary(),h=health(),a=A(D.allocations),as=a.reduce((x,r)=>x+N(r.allocated_total),0),ar=a.reduce((x,r)=>x+N(r.allocated_remaining),0),rs=A(D.reps).reduce((x,r)=>x+N(r.sales),0);const ok=S(h.phase6f6_status)==='PHASE6F6_APP_READ_CONTRACT_MATCH'&&Math.abs(as-N(s.company_sales))<=.01&&Math.abs(ar-N(s.receivables_from_sales||s.invoice_remaining))<=.01&&Math.abs(rs-N(s.company_sales))<=.01;$('healthDot').className='dot '+(ok?'ok':'bad');$('healthText').textContent=ok?`Canonical Contract MATCH • Sales ${money(s.company_sales)} • Remaining ${money(s.receivables_from_sales||s.invoice_remaining)}`:T('contractCheck');return ok}
async function loadData(){try{$('error').style.display='none';$('status').textContent=LANG==='ar'?'جاري تحميل البيانات…':'Loading canonical data…';const [s,h,i,o,r,p,a]=await Promise.all([getAll(V.summary),getAll(V.health),getAll(V.inventory),getAll(V.orders),getAll(V.reps),getAll(V.purchases),getAll(V.allocations)]);Object.assign(D,{summary:s,health:h,inventory:i,orders:o,reps:r,purchases:p,allocations:a});if(!validate())throw new Error('Canonical contract validation failed');renderDashboard();renderProducts();$('status').textContent='Canonical DB Connected\\n'+new Date().toLocaleTimeString('ar-EG');$('loading').style.display='none'}catch(e){console.error(e);$('loading').style.display='none';$('error').style.display='block';$('error').textContent='خطأ في تحميل البيانات:\\n'+e.message;$('status').textContent='Connection error'}}
applyLanguage();loadData();
</script>
