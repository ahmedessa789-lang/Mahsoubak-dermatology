<style>
:root{--purple:#7c4b6b;--purple2:#68415b;--ink:#172033;--bg:#f5f7fb;--card:#fff;--line:#e6e9f0;--muted:#6b7280;--ok:#168a65;--danger:#c9342d;--blue:#2467d8;--shadow:0 12px 30px rgba(29,32,45,.08)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Tahoma,Arial,sans-serif;color:var(--ink);background:var(--bg)}
body{overflow-y:scroll}.app{min-height:100vh}.sidebar{position:fixed;right:0;top:0;bottom:0;width:205px;background:linear-gradient(180deg,var(--purple),var(--purple2));color:#fff;padding:18px 14px;overflow:auto;z-index:20}.brand{text-align:center;padding:4px 8px 18px;border-bottom:1px solid rgba(255,255,255,.22);margin-bottom:13px}.logo{width:44px;height:44px;background:#fff;border-radius:14px;margin:0 auto 9px}.brand h1{font-size:22px;line-height:1.02;margin:0}.brand p{font-size:10px;opacity:.9;margin:8px 0 0}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#fff;border-radius:7px;padding:10px 11px;text-align:right;cursor:pointer;font-weight:700;font-size:12px}.nav button:hover,.nav button.active{background:#fff;color:#231923}.main{margin-right:205px;padding:14px 16px 38px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--purple);border-radius:13px;padding:10px 14px;color:#fff;margin-bottom:12px}.topbar h2{margin:0;font-size:18px}.status{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:6px 9px;background:rgba(0,0,0,.16);font-size:11px;font-weight:900}.dot{width:8px;height:8px;border-radius:50%;background:#fbbf24}.dot.ok{background:#34d399}.dot.bad{background:#f87171}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.metric{background:var(--purple);color:white;border-radius:16px;padding:16px;min-height:150px;box-shadow:var(--shadow);position:relative;overflow:hidden}.metric.clickable{cursor:pointer;transition:transform .14s ease,box-shadow .14s ease}.metric.clickable:hover{transform:translateY(-2px);box-shadow:0 16px 34px rgba(29,32,45,.15)}.metric:after{content:"";position:absolute;left:-38px;bottom:-64px;width:170px;height:170px;border:1px solid rgba(255,255,255,.09);border-radius:50%}.metric .tag{position:absolute;left:12px;top:12px;background:#101827;color:#fff;border-radius:999px;font-size:10px;padding:5px 8px;font-weight:900}.metric h3{font-size:12px;font-weight:500;margin:30px 0 6px;opacity:.96}.metric strong{display:block;font-size:27px;direction:ltr;text-align:right}.metric .sub{margin-top:17px;font-size:11px;display:flex;justify-content:space-between;gap:8px;opacity:.95}.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px;margin-top:12px}.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.card h3{margin:0;font-size:17px}.hint{font-size:11px;color:var(--muted)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mini{border:1px solid var(--line);border-radius:13px;padding:13px;background:#fbfcfe}.mini span{font-size:11px;color:var(--muted)}.mini b{display:block;font-size:20px;margin-top:5px}.table-wrap{overflow:auto;max-height:560px;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;font-size:12px;background:#fff}th{position:sticky;top:0;background:#f7f8fb;z-index:1}th,td{padding:10px 9px;border-bottom:1px solid #edf0f4;text-align:right;white-space:nowrap}tbody tr:hover{background:#fbf7fa}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2ff;font-size:10px}.pill.ok{background:#e8f8f1;color:#13795b}.pill.warn{background:#fff6db;color:#8a6500}.pill.bad{background:#ffe9e7;color:#9f2d27}.btn{border:0;border-radius:9px;padding:9px 12px;background:var(--purple);color:#fff;cursor:pointer;font-weight:800}.btn.secondary{background:#edf0f5;color:#222}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar input{border:1px solid #d8dde6;border-radius:9px;padding:9px 10px;min-width:220px}.loading{padding:38px;text-align:center;color:var(--muted)}.error{padding:13px;border:1px solid #f3bbb6;background:#fff0ef;border-radius:11px;color:#982c26}.readonly{position:fixed;left:12px;bottom:12px;background:#0f5132;color:#fff;border-radius:999px;padding:7px 10px;font-size:10px;font-weight:900;z-index:30;box-shadow:0 8px 18px rgba(0,0,0,.18)}.module{display:none}.module.active{display:block}.empty{padding:25px;text-align:center;color:var(--muted)}.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.46);z-index:100;display:none;align-items:center;justify-content:center;padding:24px}.modal-backdrop.open{display:flex}.modal-panel{width:min(1180px,96vw);max-height:88vh;background:#fff;border-radius:18px;box-shadow:0 28px 70px rgba(0,0,0,.28);overflow:hidden;display:flex;flex-direction:column}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line);background:#fbfcfe}.modal-head h3{margin:0;font-size:18px}.modal-body{padding:14px 16px 18px;overflow:auto}.modal-close{border:0;background:#eef1f5;border-radius:9px;padding:8px 11px;cursor:pointer;font-weight:900}.modal-summary{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.modal-summary .pill{font-size:11px;padding:6px 9px}
@media(max-width:980px){.sidebar{position:static;width:auto;height:auto}.main{margin-right:0}.metrics{grid-template-columns:1fr 1fr}.nav{grid-template-columns:repeat(3,1fr)}}
@media(max-width:640px){.metrics,.grid2{grid-template-columns:1fr}.nav{grid-template-columns:1fr 1fr}.main{padding:10px}.topbar{align-items:flex-start;flex-direction:column}}
</style>

<div id="detailModal" class="modal-backdrop" aria-hidden="true"><div class="modal-panel"><div class="modal-head"><h3 id="detailModalTitle">التفاصيل</h3><button class="modal-close" onclick="closeDetailModal()">✕ إغلاق</button></div><div id="detailModalBody" class="modal-body"><div class="loading">تحميل…</div></div></div></div>

<script>
'use strict';
const SUPABASE_URL='https://fkksydpbfqkctvlkoaom.supabase.co';
const SUPABASE_KEY='sb_publishable_gq0JyUXR5M57OZAaOd6eEg_6WyzVx9D';
const headers={apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY};
const cache=new Map();
const loaded=new Set();
let summary=null;
function n(v){const x=Number(v);return Number.isFinite(x)?x:0}
function money(v){return 'EGP '+n(v).toLocaleString('en-US',{maximumFractionDigits:0})}
function num(v,d=0){return n(v).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d})}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function api(path,{refresh=false}={}){
  if(!refresh&&cache.has(path))return cache.get(path);
  const url=SUPABASE_URL.replace(/\/$/,'')+'/rest/v1/'+path;
  const p=fetch(url,{headers}).then(async r=>{if(!r.ok)throw new Error((await r.text())||('HTTP '+r.status));return r.json()});
  cache.set(path,p);try{return await p}catch(e){cache.delete(path);throw e}
}
function setStatus(ok,text){document.getElementById('statusText').textContent=text;const d=document.getElementById('dot');d.className='dot '+(ok?'ok':'bad')}
function renderError(id,e){document.getElementById(id).innerHTML='<div class="error"><b>تعذر تحميل البيانات</b><div style="margin-top:6px">'+esc(e.message)+'</div></div>'}
function table(headers,rows){if(!rows.length)return '<div class="empty">لا توجد بيانات</div>';return '<div class="table-wrap"><table><thead><tr>'+headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>'}

function openDetailModal(title,html){
 const m=document.getElementById('detailModal');
 document.getElementById('detailModalTitle').textContent=title;
 document.getElementById('detailModalBody').innerHTML=html||'<div class="loading">تحميل…</div>';
 m.classList.add('open');m.setAttribute('aria-hidden','false');
}
function closeDetailModal(){const m=document.getElementById('detailModal');m.classList.remove('open');m.setAttribute('aria-hidden','true')}
document.getElementById('detailModal').addEventListener('click',e=>{if(e.target.id==='detailModal')closeDetailModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetailModal()});
async function openCardDetail(kind){
 try{
  if(kind==='sales'){
   openDetailModal('تفاصيل المبيعات والفواتير');
   const rows=await api('mahsoubak_app_invoice_detail?select=*&order=invoice_date.desc,invoice_ref.desc');
   const total=rows.reduce((a,x)=>a+n(x.invoice_total),0);
   document.getElementById('detailModalBody').innerHTML='<div class="modal-summary"><span class="pill ok">إجمالي المبيعات '+money(total)+'</span><span class="pill">'+rows.length+' فاتورة</span></div>'+table(['الفاتورة','التاريخ','العميل','الكمية','الإجمالي','المدفوع','المتبقي','الحالة'],rows.map(x=>`<tr><td><b>${esc(x.invoice_ref)}</b></td><td>${esc(x.invoice_date)}</td><td>${esc(x.customer_name)}</td><td>${num(x.qty,1)}</td><td>${money(x.invoice_total)}</td><td>${money(x.paid)}</td><td>${money(x.remaining)}</td><td><span class="pill ${x.invoice_status==='FULLY_PAID'?'ok':x.invoice_status==='PARTIALLY_PAID'?'warn':''}">${esc(x.invoice_status)}</span></td></tr>`));
   return;
  }
  if(kind==='debt'){
   openDetailModal('تفاصيل مديونيات العملاء');
   const rows=await api('mahsoubak_app_customer_receivable_detail?select=*&order=receivable_balance.desc');
   const total=rows.reduce((a,x)=>a+n(x.receivable_balance),0);
   document.getElementById('detailModalBody').innerHTML='<div class="modal-summary"><span class="pill ok">إجمالي المديونية '+money(total)+'</span><span class="pill">'+rows.length+' عميل</span></div>'+table(['العميل','الفواتير','المبيعات','المدفوع','الرصيد'],rows.map(x=>`<tr><td><b>${esc(x.customer_name)}</b></td><td>${num(x.invoice_count)}</td><td>${money(x.sales_total)}</td><td>${money(x.paid_from_sales)}</td><td><b>${money(x.receivable_balance)}</b></td></tr>`));
   return;
  }
  if(kind==='paid'){
   openDetailModal('الفواتير المدفوعة / المسددة جزئيًا');
   const rows=await api('mahsoubak_app_paid_invoice_detail?select=*&order=invoice_date.desc,invoice_ref.desc');
   const total=rows.reduce((a,x)=>a+n(x.paid),0);
   document.getElementById('detailModalBody').innerHTML='<div class="modal-summary"><span class="pill ok">إجمالي المدفوع '+money(total)+'</span><span class="pill">'+rows.length+' فاتورة بها سداد</span></div>'+table(['الفاتورة','التاريخ','العميل','الإجمالي','المدفوع','المتبقي','الحالة'],rows.map(x=>`<tr><td><b>${esc(x.invoice_ref)}</b></td><td>${esc(x.invoice_date)}</td><td>${esc(x.customer_name)}</td><td>${money(x.invoice_total)}</td><td><b>${money(x.paid)}</b></td><td>${money(x.remaining)}</td><td><span class="pill ${x.invoice_status==='FULLY_PAID'?'ok':'warn'}">${esc(x.invoice_status)}</span></td></tr>`));
   return;
  }
  if(kind==='stock'){
   openDetailModal('تفاصيل المخزون');
   const rows=await api('mahsoubak_app_inventory_detail?select=*&order=product_name.asc');
   const qty=rows.reduce((a,x)=>a+n(x.current_stock_qty),0), val=rows.reduce((a,x)=>a+n(x.ending_inventory_value),0);
   document.getElementById('detailModalBody').innerHTML='<div class="modal-summary"><span class="pill ok">قيمة المخزون '+money(val)+'</span><span class="pill">الكمية '+num(qty,0)+'</span></div>'+table(['المنتج','الكمية الحالية','تكلفة الوحدة','قيمة المخزون','المباع','COGS','الحالة'],rows.map(x=>`<tr><td><b>${esc(x.product_name)}</b></td><td>${num(x.current_stock_qty,0)}</td><td>${money(x.canonical_unit_cost)}</td><td>${money(x.ending_inventory_value)}</td><td>${num(x.sold_qty,0)}</td><td>${money(x.historical_cogs)}</td><td><span class="pill ${x.status==='MATCH'?'ok':'bad'}">${esc(x.status)}</span></td></tr>`));
   return;
  }
  if(kind==='treasury'){
   openDetailModal('تفاصيل حركة الخزينة');
   const rows=await api('mahsoubak_app_treasury_movement_detail?select=*&order=transaction_date.desc');
   const bal=rows.reduce((a,x)=>a+n(x.signed_amount),0);
   document.getElementById('detailModalBody').innerHTML='<div class="modal-summary"><span class="pill ok">رصيد الخزينة '+money(bal)+'</span><span class="pill">'+rows.length+' حركة</span></div>'+table(['التاريخ','الحركة','الطرف','المبلغ','Signed','التصنيف'],rows.map(x=>`<tr><td>${esc(x.transaction_date)}</td><td>${esc(x.movement_type)}</td><td>${esc(x.party_name)}</td><td>${money(x.amount)}</td><td><b>${money(x.signed_amount)}</b></td><td>${esc(x.classification)}</td></tr>`));
   return;
  }
 }catch(e){document.getElementById('detailModalBody').innerHTML='<div class="error"><b>تعذر تحميل التفاصيل</b><div style="margin-top:6px">'+esc(e.message)+'</div></div>'}
}
async function loadDashboard(){
 try{
  const [h,d]=await Promise.all([
   api('mahsoubak_app_phase6f6_health?select=phase6f6_status&limit=1'),
   api('mahsoubak_app_dashboard_summary?select=*&limit=1')
  ]);
  summary=d[0]||{};const health=h[0]?.phase6f6_status||'';setStatus(health==='PHASE6F6_APP_READ_CONTRACT_MATCH','Canonical App Contract '+(health.includes('MATCH')?'MATCH':'REVIEW'));
  const s=summary;
  document.getElementById('dashboardRoot').innerHTML=`
  <div class="metrics">
   <div class="metric clickable" onclick="openCardDetail('sales')"><span class="tag">SALES</span><h3>المبيعات</h3><strong>${money(s.company_sales)}</strong><div class="sub"><span>الفواتير</span><b>${num(s.invoice_count)}</b></div></div>
   <div class="metric clickable" onclick="openCardDetail('stock')"><span class="tag">STOCK</span><h3>المخزون</h3><strong>${money(s.inventory_value)}</strong><div class="sub"><span>الكمية</span><b>${num(s.stock_qty)}</b></div></div>
   <div class="metric clickable" onclick="openCardDetail('debt')"><span class="tag">DEBT</span><h3>مديونيات العملاء</h3><strong>${money(s.receivables_from_sales)}</strong><div class="sub"><span>التحصيلات</span><b>${money(s.collection_cash)}</b></div></div>
   <div class="metric"><span class="tag">OPS</span><h3>العمليات</h3><strong>—</strong><div class="sub"><span>تحميل عند فتح القسم</span><b>Lazy</b></div></div>
   <div class="metric clickable" onclick="openCardDetail('paid')"><span class="tag">PAID</span><h3>المدفوع على الفواتير</h3><strong>${money(s.invoice_paid)}</strong><div class="sub"><span>غير مطبق</span><b>${money(s.collection_unapplied)}</b></div></div>
   <div class="metric clickable" onclick="openCardDetail('treasury')"><span class="tag">FIN</span><h3>الخزينة</h3><strong>${money(s.treasury_balance)}</strong><div class="sub"><span>المصروفات</span><b>${money(s.expense_total)}</b></div></div>
  </div>
  <div class="card"><div class="card-head"><div><h3>خريطة السيولة والالتزامات</h3><div class="hint">الأرقام مباشرة من الـCanonical App Contract</div></div><span class="pill ok">READ CONTRACT MATCH</span></div>
  <div class="grid2"><div class="mini"><span>إجمالي الأصول</span><b>${money(s.total_assets)}</b></div><div class="mini"><span>صافي دخل الفترة</span><b>${money(s.current_period_net_income)}</b></div><div class="mini"><span>COGS</span><b>${money(s.cogs)}</b></div><div class="mini"><span>Balance Sheet Difference</span><b>${money(s.balance_sheet_difference)}</b></div></div></div>`;
 }catch(e){setStatus(false,'Load failed');renderError('dashboardRoot',e)}
}
async function loadInventory(){if(loaded.has('inventory'))return;loaded.add('inventory');try{const rows=await api('mahsoubak_app_inventory_detail?select=*&order=product_name.asc');document.getElementById('inventoryRoot').innerHTML='<div class="card"><div class="card-head"><div><h3>المنتجات والمخزون</h3><div class="hint">مصدر واحد: canonical inventory detail</div></div><span class="pill ok">'+rows.length+' منتجات</span></div>'+table(['المنتج','الكمية الحالية','تكلفة الوحدة','قيمة المخزون','المباع','COGS','الحالة'],rows.map(x=>`<tr><td><b>${esc(x.product_name)}</b></td><td>${num(x.current_stock_qty,0)}</td><td>${money(x.canonical_unit_cost)}</td><td>${money(x.ending_inventory_value)}</td><td>${num(x.sold_qty,0)}</td><td>${money(x.historical_cogs)}</td><td><span class="pill ${x.status==='MATCH'?'ok':'bad'}">${esc(x.status)}</span></td></tr>`))+'</div>'}catch(e){renderError('inventoryRoot',e)}}
async function loadReceivables(){if(loaded.has('receivables'))return;loaded.add('receivables');try{const rows=await api('mahsoubak_app_customer_receivable_detail?select=*&order=receivable_balance.desc');document.getElementById('receivablesRoot').innerHTML='<div class="card"><div class="card-head"><div><h3>مديونيات العملاء</h3><div class="hint">التفاصيل من نفس مصدر كارت المديونية</div></div><span class="pill">'+rows.length+' عميل</span></div>'+table(['العميل','الفواتير','المبيعات','المدفوع','الرصيد'],rows.map(x=>`<tr><td><b>${esc(x.customer_name)}</b></td><td>${num(x.invoice_count)}</td><td>${money(x.sales_total)}</td><td>${money(x.paid_from_sales)}</td><td><b>${money(x.receivable_balance)}</b></td></tr>`))+'</div>'}catch(e){renderError('receivablesRoot',e)}}
async function loadReps(){if(loaded.has('reps'))return;loaded.add('reps');try{const rows=await api('mahsoubak_app_rep_sales?select=*&order=sales.desc');document.getElementById('repsRoot').innerHTML='<div class="card"><div class="card-head"><div><h3>تقرير المندوبين</h3><div class="hint">Customer split + manual override محفوظين في sales allocations</div></div><span class="pill ok">'+money(rows.reduce((a,x)=>a+n(x.sales),0))+'</span></div>'+table(['المندوب','عدد العمليات','الكمية','المبيعات','المدفوع','المتبقي'],rows.map(x=>`<tr><td><b>${esc(x.rep_name)}</b></td><td>${num(x.sale_count)}</td><td>${num(x.qty,1)}</td><td>${money(x.sales)}</td><td>${money(x.paid)}</td><td>${money(x.remaining)}</td></tr>`))+'</div>'}catch(e){renderError('repsRoot',e)}}
async function loadInvoices(){if(loaded.has('invoices'))return;loaded.add('invoices');try{const rows=await api('mahsoubak_app_invoice_detail?select=*&order=invoice_date.desc,invoice_ref.desc');document.getElementById('invoicesRoot').innerHTML='<div class="card"><div class="card-head"><div><h3>الفواتير</h3><div class="hint">53 Invoice groups من الـCanonical invoice view</div></div><span class="pill">'+rows.length+' فاتورة</span></div>'+table(['الفاتورة','التاريخ','العميل','الكمية','الإجمالي','المدفوع','المتبقي','الحالة'],rows.map(x=>`<tr><td><b>${esc(x.invoice_ref)}</b></td><td>${esc(x.invoice_date)}</td><td>${esc(x.customer_name)}</td><td>${num(x.qty,1)}</td><td>${money(x.invoice_total)}</td><td>${money(x.paid)}</td><td>${money(x.remaining)}</td><td><span class="pill ${x.invoice_status==='FULLY_PAID'?'ok':x.invoice_status==='PARTIALLY_PAID'?'warn':''}">${esc(x.invoice_status)}</span></td></tr>`))+'</div>'}catch(e){renderError('invoicesRoot',e)}}
async function loadCollections(){if(loaded.has('collections'))return;loaded.add('collections');try{const rows=await api('mahsoubak_app_collection_detail?select=*&order=collection_date.desc');document.getElementById('collectionsRoot').innerHTML='<div class="card"><div class="card-head"><div><h3>التحصيلات</h3><div class="hint">Cash / Applied / Unapplied منفصلين</div></div><span class="pill ok">'+money(rows.reduce((a,x)=>a+n(x.cash_received),0))+'</span></div>'+table(['التاريخ','العميل','المحصل','المطبق','رصيد زائد','الحالة'],rows.map(x=>`<tr><td>${esc(x.collection_date)}</td><td><b>${esc(x.customer_name)}</b></td><td>${money(x.cash_received)}</td><td>${money(x.applied_to_invoices)}</td><td>${money(x.unapplied_customer_credit)}</td><td>${esc(x.approval_status)}</td></tr>`))+'</div>'}catch(e){renderError('collectionsRoot',e)}}
async function loadTerritories(){if(loaded.has('territories'))return;loaded.add('territories');try{const [tot,det]=await Promise.all([api('mahsoubak_app_territory_totals?select=*&order=sales.desc'),api('mahsoubak_app_territory_sales?select=*&order=territory_group.asc,territory_code.asc')]);document.getElementById('territoriesRoot').innerHTML='<div class="card"><div class="card-head"><div><h3>المناطق</h3><div class="hint">West / East / Delta / Alexandria من نفس allocations</div></div><span class="pill ok">'+money(tot.reduce((a,x)=>a+n(x.sales),0))+'</span></div>'+table(['المجموعة','المنطقة','العمليات','الكمية','المبيعات','المتبقي'],det.map(x=>`<tr><td><b>${esc(x.territory_group)}</b></td><td>${esc(x.territory_code)}</td><td>${num(x.sale_count)}</td><td>${num(x.qty,1)}</td><td>${money(x.sales)}</td><td>${money(x.remaining)}</td></tr>`))+'</div>'}catch(e){renderError('territoriesRoot',e)}}
async function loadFinance(){if(loaded.has('finance'))return;loaded.add('finance');try{const [exp,tre]=await Promise.all([api('mahsoubak_app_expense_detail?select=*&order=expense_date.desc'),api('mahsoubak_app_treasury_movement_detail?select=*&order=transaction_date.desc')]);document.getElementById('financeRoot').innerHTML=`<div class="metrics"><div class="metric"><span class="tag">TREASURY</span><h3>الخزينة</h3><strong>${money(summary?.treasury_balance)}</strong></div><div class="metric"><span class="tag">EXPENSES</span><h3>المصروفات</h3><strong>${money(summary?.expense_total)}</strong></div><div class="metric"><span class="tag">NET</span><h3>صافي دخل الفترة</h3><strong>${money(summary?.current_period_net_income)}</strong></div></div><div class="card"><div class="card-head"><h3>حركات الخزينة</h3><span class="pill">${tre.length} حركة</span></div>${table(['التاريخ','النوع','الطرف','المبلغ','Signed','التصنيف'],tre.map(x=>`<tr><td>${esc(x.transaction_date)}</td><td>${esc(x.movement_type)}</td><td>${esc(x.party_name)}</td><td>${money(x.amount)}</td><td>${money(x.signed_amount)}</td><td>${esc(x.classification)}</td></tr>`))}</div><div class="card"><div class="card-head"><h3>المصروفات</h3><span class="pill">${exp.length} صف</span></div>${table(['التاريخ','المجموعة','الفئة','المبلغ','ملاحظات'],exp.map(x=>`<tr><td>${esc(x.expense_date)}</td><td>${esc(x.expense_group)}</td><td>${esc(x.category_name)}</td><td>${money(x.amount)}</td><td>${esc(x.notes)}</td></tr>`))}</div>`}catch(e){renderError('financeRoot',e)}}
async function loadOrders(){if(loaded.has('orders'))return;loaded.add('orders');const root=document.getElementById('ordersRoot');root.innerHTML='<div class="loading">تحميل آخر 150 أمر مباشرة من normalized orders…</div>';try{const rows=await api('mahsoubak_sales_orders?select=id,order_date,customer_name,rep_name,product_name,qty,total,status,approval_status,payload&order=order_date.desc&limit=150');root.innerHTML='<div class="card"><div class="card-head"><div><h3>طلبات / Operation المخزن</h3><div class="hint">تحميل Lazy — لا يتم استدعاء الجدول إلا عند فتح القسم</div></div><span class="pill">آخر '+rows.length+'</span></div>'+table(['التاريخ','العميل','المندوب','المنتج','الكمية','الإجمالي','الحالة','Operation'],rows.map(x=>`<tr><td>${esc(x.order_date)}</td><td>${esc(x.customer_name)}</td><td>${esc(x.rep_name)}</td><td>${esc(x.product_name)}</td><td>${num(x.qty,1)}</td><td>${money(x.total)}</td><td>${esc(x.approval_status||x.status)}</td><td>${esc(x.payload?.operation_status||'')}</td></tr>`))+'</div>'}catch(e){renderError('ordersRoot',e)}}
function placeholder(root,title,text){document.getElementById(root).innerHTML='<div class="card"><div class="card-head"><div><h3>'+esc(title)+'</h3><div class="hint">'+esc(text)+'</div></div><span class="pill warn">TEST</span></div><div class="empty">هذا القسم لم يتم تحويله بعد في Phase 6F9 حتى لا نخلط بين مصدر قديم ومصدر Canonical.</div></div>'}
const loaders={dashboard:loadDashboard,inventory:loadInventory,receivables:loadReceivables,reps:loadReps,invoices:loadInvoices,collections:loadCollections,territories:loadTerritories,finance:loadFinance,orders:loadOrders,targets:()=>placeholder('targetsRoot','Sales Target','سيتم ربطه بعد تثبيت contract للـtarget quantity بدون bonus.'),purchases:()=>placeholder('purchasesRoot','المشتريات','موجودة في قاعدة البيانات لكن لم نربط UI القديم تلقائيًا في نسخة الاختبار.'),reports:()=>placeholder('reportsRoot','التقارير','سيتم تجميع التقارير من نفس canonical views بعد اعتماد أداء الواجهة النظيفة.')};
const titles={dashboard:'الرئيسية',inventory:'المنتجات والمخزون',receivables:'العملاء',reps:'تقرير المندوبين',targets:'Sales Target',orders:'طلبات / Operation المخزن',purchases:'المشتريات',invoices:'الفواتير',collections:'التحصيلات',reports:'التقارير',finance:'المالية',territories:'المناطق'};
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-module]');if(!b)return;const key=b.dataset.module;document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.module').forEach(x=>x.classList.remove('active'));document.getElementById('m-'+key).classList.add('active');document.getElementById('pageTitle').textContent=titles[key]||key;(loaders[key]||(()=>{}))()});
loadDashboard();
</script>
</body></html>
